version: 2
updates:
  # Rust workspace dependencies. Grouped into a single PR per run to keep the
  # noise down — the CI gates (clippy, workspace tests, audit) vet the bump.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # The GitHub Actions pinned by SHA/tag in .github/workflows/ and in the
  # local composite actions under .github/actions/ (which "/" alone misses).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      # Every codeql-action sub-action is released from one commit, so they
      # must move together — a partial bump leaves an analysis run mixing
      # action versions. A glob rather than a list of sub-actions: naming them
      # individually is what let `upload-sarif` (scorecard.yml) drift out of
      # the group, so one v4 bump arrived as two PRs (#1041 and #1051) instead
      # of one. The glob also picks up any sub-action added later.
      codeql-workflow:
        patterns:
          - "github/codeql-action/*"

  # The npm-published tree-sitter grammar (a planned release channel).
  - package-ecosystem: npm
    directory: "/tree-sitter-bynk"
    schedule:
      interval: weekly

  # The @bynk/runtime package bundled into the compiler via include_str!.
  - package-ecosystem: npm
    directory: "/bynk-emit/runtime"
    schedule:
      interval: weekly

  # The Astro/Starlight docs site. Its deploy job holds the Cloudflare token.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    # `astro` peers `@astrojs/markdown-remark` at an exact version, so it must
    # never move ahead of `astro` on its own. /site depends on it directly (the
    # legacy `markdown.remarkPlugins`/`rehypePlugins` hooks need it since astro
    # 7.2.4), so without this it is an eligible standalone update. See the note
    # on the `astro` group below.
    ignore:
      - dependency-name: "@astrojs/markdown-remark"
    groups:
      # Astro and Starlight move in lockstep — Starlight's peer range tracks
      # the astro minor, so a split bump means one PR waiting on the other.
      # Group them so a release lands as one resolvable PR.
      #
      # This is defence in depth, not the whole fix: grouping only merges what
      # dependabot updates in the *same* run, so a staggered release can still
      # split. The exact-peer trap that deadlocked #1036/#1038 was originally
      # closed by dropping `@astrojs/markdown-remark` as a direct dependency of
      # /site so it resolved transitively behind `astro`. That is no longer
      # possible: astro 7.2.4 made Sätteri the default Markdown processor and
      # stopped installing `@astrojs/markdown-remark` by default, so a config
      # using `markdown.remarkPlugins`/`rehypePlugins` — as /site does, for the
      # mdBook directives and rehype-mermaid — must depend on it explicitly, or
      # `astro build` fails config validation.
      #
      # Grouping alone does NOT re-close that trap. `astro` peers the package at
      # an EXACT version, not a range (`peerDependencies: {"@astrojs/markdown-
      # remark": "7.2.2"}`, optional), while /site declares `^7.2.2`. A group is
      # not a guarantee of company: if `markdown-remark` publishes a 7.2.x in a
      # week `astro` does not, the weekly run finds exactly one member with an
      # update and opens a ONE-package group PR for it — root then wants 7.2.3
      # against astro's exact 7.2.2 peer, which is an ERESOLVE and the same
      # manual unpick as #1036/#1038, just at one-PR granularity. That is what
      # the `ignore` entry above is for: the package is never proposed on its
      # own, so it only ever moves when a grouped `astro` bump drags the lock
      # entry along (the caret range admits the new version without a manifest
      # edit). Keep the caret AND the ignore — either alone reopens the trap.
      # Do not narrow the glob below to named packages.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-*"
