name: VS Code Marketplace identity

# One-off setup helper for release.yml's `publish-vscode` job. Signs in as the
# Entra app registration through the `vscode-marketplace` environment, exactly
# as the publish does, and prints the Azure DevOps profile of that identity.
# Its `id` is what the Marketplace publisher's Members page takes, to add the
# app as a Contributor of `bynk`. A successful run also proves the federated
# credential and environment variables are wired correctly.
#
#     gh workflow run vscode-marketplace-identity.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: Print the publishing identity's profile ID
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write # OIDC for the Entra federated credential
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Profile
        # 499b84ac-… is the Azure DevOps resource (the Marketplace's audience).
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 | tee profile.json
          echo "::notice::Add this ID to the bynk publisher's Members as Contributor: $(jq -r .id profile.json)"
