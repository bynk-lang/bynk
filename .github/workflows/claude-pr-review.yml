# Automated code review on pull requests.
#
# Runs once, when a PR is marked ready for review — not on open, and not on
# every subsequent push. The workflow this scopes to: open as a draft, let CI
# and any fixups land while draft (no review triggered), then mark ready once
# it's green. Later pushes do NOT re-trigger this automatically; a further
# review is a deliberate, manual call (e.g. an `@claude` mention), not
# something every commit pays for. Reviews are workflow-aware: Claude reads
# `design/` at runtime, so it can check a change against our release discipline
# (the `design/pending/<slug>.md` increment file, ADR conventions, the test
# gate) rather than reviewing the diff in isolation.
#
# Two ways in:
#   - `ready_for_review`: a human marks the draft ready.
#   - `workflow_dispatch` with a `pr_number` input: auto-ready.yml promotes a
#     green draft and dispatches the review here. The dispatch exists because
#     the promotion runs on the default GITHUB_TOKEN, whose events never start
#     workflow runs — its `ready_for_review` event fires but cannot trigger
#     this workflow, so auto-ready.yml invokes it by name instead
#     (`workflow_dispatch` is the documented exception to the no-retrigger
#     rule). The input also gives maintainers a manual re-review button in the
#     Actions tab, which the run-once discipline above otherwise lacks.
#
# NOTE on fork PRs: `pull_request` from a fork gets a read-only token, so review
# comments will NOT post on external contributions. If you need that, switch to
# `pull_request_target` and check out the *base* ref to stay safe from untrusted
# code — see anthropics/claude-code-action security docs before doing so.
#
# Requires the Claude GitHub App installed on the repo and a
# `CLAUDE_CODE_OAUTH_TOKEN` secret — a Claude Pro/Max subscription token from
# `claude setup-token` (or wired up by `/install-github-app`). Runs draw on the
# subscription's usage limits, not metered API billing.
name: Claude PR Review

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

# Belt-and-suspenders: the ready_for_review transition and the auto-ready
# dispatch shouldn't stack if both ever fire for the same PR, and neither
# should a manual re-run.
concurrency:
  group: claude-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# Least privilege: read the tree, write the PR review/comments.
# `id-token: write` lets the action mint its GitHub token from the Claude App
# via OIDC — required by claude-code-action@v1 regardless of the Anthropic auth.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # `draft == false` is redundant against the `ready_for_review`-only trigger
    # above (that event only fires on the draft→ready transition, so draft is
    # always already false) — kept as a defensive, self-documenting check in
    # case the trigger types above ever grow again. Never Dependabot's: those
    # are dependency bumps we don't want reviewed (and run with a read-only
    # token that couldn't post anyway).
    #
    # A `workflow_dispatch` run skips both checks: auto-ready.yml has already
    # applied them (draft state, Dependabot, keep-draft) before dispatching,
    # and a human dispatching from the Actions tab is making a deliberate call
    # — including, legitimately, on a still-draft PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On dispatch there is no PR context, so name the PR's merge ref
      # explicitly — the same merge commit a `pull_request` checkout gets by
      # default. (If the PR has conflicts the merge ref doesn't exist and this
      # fails loudly, which beats silently reviewing the default branch.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # full history so Claude can diff against the base branch
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses to run for a non-human actor unless that bot is
          # allow-listed, and auto-ready.yml dispatches on the default
          # GITHUB_TOKEN — so every auto-promoted review failed with
          # "Workflow initiated by non-human actor: github-actions (type: Bot)".
          # Allow exactly that one bot, and only on the dispatch path: this
          # repo's own GITHUB_TOKEN is the only bot that legitimately starts a
          # review, and `ready_for_review` is always a human marking the draft
          # ready. Never `*` — on a public repo that lets any installed app
          # invoke the action with a prompt it controls.
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions' || '' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Review this pull request. The PR branch is checked out in the
            working directory; work primarily from the diff.

            Focus on:
            - Correctness: logic errors, edge cases, and boundary conditions
              that the changed code could get wrong.
            - Security and safety of the change.
            - Test coverage: is the edge where the change could be wrong actually
              exercised, not just the happy path?
            - Release discipline: a non-trivial code change should carry exactly
              one `design/pending/<slug>.md` increment file (a `level` plus a
              `changelog`). Flag if it is missing, or if a pure docs/infra change
              added one needlessly. Do NOT pick a version or ADR number — those
              are assigned by the merge-time stamp. Likewise, a PR that carries
              an increment file should name any gated greenfield probe it moves
              in that file's `probes` key rather than editing
              `design/greenfield-status.md` (the stamp rewrites the table on
              merge); flag a hand-edited table alongside an increment. Consult
              `design/bynk-release-discipline.md` ONLY if you need to confirm this
              rule.

            Work efficiently: review the diff directly and open a repo file only
            when a specific finding requires it. Do NOT browse `design/` or the
            tree exhaustively — that burns the turn budget before you can post.

            Post your findings ONLY as GitHub comments — do NOT emit the review
            as a chat message (that goes nowhere):
            - `gh pr comment` for the top-level summary.
            - `mcp__github_inline_comment__create_inline_comment` (with
              `confirmed: true`) for line-specific issues.
            Prioritise real, actionable findings over stylistic nits. If the
            change looks sound, still post a brief approving summary comment.
          # Opus for the deepest correctness/edge-case rigour on code changes.
          # The diff is already in context; the prompt keeps Claude from browsing
          # design/ (that exhausted 30 turns on a 12-file PR without posting).
          # No --max-turns: a fixed cap has no principled value if the review
          # sometimes needs one turn more than it allows — better to let a
          # focused review run to completion than truncate it arbitrarily.
          # --allowedTools is REQUIRED: without it Claude's post attempts are
          # denied (a run finished with 11 permission denials and posted nothing).
          # The action does not auto-publish the review; Claude must call these.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
