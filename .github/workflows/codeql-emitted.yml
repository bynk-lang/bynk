name: CodeQL (emitted TypeScript)

# SAST over the TypeScript the compiler EMITS, not the repo's own sources
# (#255). codeql.yml scans the hand-written runtime and the Rust compiler; a
# flaw in a codegen template lives only in the output, so nothing scanned it.
#
# The stock JS/TS models have no notion of a Cloudflare module Worker, so on
# their own they see no user input in Bynk's output and pass forever. The
# models in .github/codeql/bynk-emitted/ add the Worker request as a source and
# the Response `Location` header as a redirect sink, and four deliberately
# vulnerable canary projects prove they still fire: a canary that is not
# flagged fails this run (and its results are not uploaded, so a broken model
# can't quietly close real alerts).
#
# OUT OF BAND ON PURPOSE. Nightly + manual only: no pull_request, merge_group
# or push trigger, not part of `CI green`, not called from any release job.
# 08:20 UTC, after ci.yml (07:00) and codeql.yml (07:40).
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-emitted
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  scan:
    name: Scan the emitted TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      # Restore only: a nightly-only entry saved every night would count
      # against the repo's cache quota and could evict the PR stage's caches.
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: false
      - name: Build bynk
        run: cargo build --locked -p bynk
      # Installs the CLI only. Not `init`: its post step can upload a
      # failed-run SARIF under the default `/language:javascript-typescript`
      # category (codeql.yml's) when the job fails, which is exactly when a
      # canary goes unflagged. The script builds and analyses the database.
      - uses: github/codeql-action/setup-codeql@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        id: codeql
        with:
          languages: javascript-typescript
      - name: Compile examples + canaries and analyse
        env:
          BYNK: ${{ github.workspace }}/target/debug/bynk
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          out="$RUNNER_TEMP/codeql-emitted"
          scripts/codeql-emitted.sh "$out"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/codeql-emitted/summary.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # Skipped when a canary was not flagged (the script exits 1): the models
      # are blind then, and an empty upload would mark real alerts fixed.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          # The category (`emitted-ts`) is embedded by the script.
          sarif_file: ${{ runner.temp }}/codeql-emitted/results-examples.sarif

  report:
    name: Report a failed scan
    needs: scan
    if: always() && github.event_name == 'schedule' && needs.scan.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Nightly emitted-TypeScript CodeQL scan failed"
          body="The emitted-TypeScript CodeQL scan failed on \`main\` at $SHA: $RUN_URL"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again. $body"
            echo "Commented on #$number."
          else
            gh issue create --title "$title" --body "$body

          Either a canary in .github/codeql/bynk-emitted/canaries/ was not flagged (the models no longer see the emitted runtime; the run summary says which), or the build or scan itself broke. See .github/codeql/bynk-emitted/README.md. Close this issue once the cause is fixed; the next failure opens a new one."
          fi
