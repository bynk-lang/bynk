name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: the full three-OS test matrix runs here (see the `test` job's
  # dynamic matrix), so macOS first runs before a PR lands rather than on the
  # post-merge push to `main` (Linux and Windows are both on the PR gate too;
  # see the `test_os` note). The queue's run is on the critical path of every
  # merge, so work with no gating value stays out of it: `coverage` skips it,
  # and no job saves a Rust cache from it (see the rust-cache note below).
  #
  # `CI green` is the only required status check and this workflow reports it,
  # so a queue cannot wedge waiting on a check that never arrives. codeql.yml
  # has no `merge_group` trigger, which is safe precisely because it is not
  # required — do not make it required without adding the trigger.
  merge_group:
  # Weekly health check: re-run the full pipeline so dependency/advisory drift
  # (a freshly published RUSTSEC advisory, a bitrotted dep) is caught even when
  # no one has opened a PR. Mondays 07:00 UTC.
  schedule:
    - cron: "0 7 * * 1"

# A new push to a PR branch cancels the superseded run for that ref.
#
# Cancellation is scoped to pull requests DELIBERATELY. When it applied to every
# ref, a merge to `main` was routinely cancelled ~60s later by the stamp commit's
# own run (same `refs/heads/main` group) — so the merge commit itself never
# completed a run, and validation was silently deferred to the stamp commit and
# made conditional on the stamp firing and succeeding. It does not always: a
# stamp run went red on Windows on 2026-07-28, leaving neither commit validated.
# Every commit on `main` now completes its own run. The cost is that an increment
# merge completes two runs (the merge and the stamp) rather than one-and-a-stub;
# that is what validating every commit costs, and it is the intended trade.
#
# The deploy pipelines (deploy-site.yml / deploy-playground.yml) have their own
# non-cancelling concurrency groups.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more opt in (changes needs
# pull-requests:read for the PR file list; dependency-review reads the diff).
permissions:
  contents: read

# The toolchain version lives in rust-toolchain.toml; the dtolnay ref below is
# pinned to match so the runner installs exactly one toolchain (with the
# rustfmt/clippy components the gates need). The `msrv` job installs the
# toolchain named by the *declared* `rust-version`; today that equals the pin
# (1.95), so it verifies the declared floor still builds. A tripwire in that job
# fails if `rust-version` and the pinned channel ever diverge — at which point
# the MSRV genuinely differs from the dev toolchain and the leg must go back to
# running on every code PR (see the job for details).
#
# Every Swatinem/rust-cache step restores in the merge queue but never SAVES
# there (`save-if`). A cache is readable only from its own ref and `main`, and
# each queue entry runs once on a throwaway `gh-readonly-queue/...` branch, so a
# queue-saved cache can never be restored by anything. It was pure cost: the
# save is a post-step on the critical path (~1.5 min on the Windows test leg),
# and each queue run wrote ~2-3 GB, pushing the repo past its 10 GB cache cap so
# LRU eviction threw out `main`'s caches — the very ones the queue restores
# from. The measured effect was a queue Windows leg finding "No cache found"
# and cold-compiling the workspace (~5.5 min) before its tests started.

jobs:
  # ---------------------------------------------------------------------------
  # Change detection. Every expensive job is gated on this so a docs-only or
  # extension-only PR doesn't pay for the full multi-OS test matrix. The gating
  # is safe against the required-checks ruleset because branch protection
  # requires only the `ci-green` aggregator below — not the individual (now
  # skippable) job names.
  #
  # `all` is the escape hatch: on push/main and the weekly schedule (anything
  # that isn't a PR), or when a global file changed (a workflow, the lockfile,
  # the toolchain), every job runs regardless of which paths the diff touched.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Read the parent commit's CI jobs for the stamp's Linux-only decision.
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      extension: ${{ steps.filter.outputs.extension }}
      grammar: ${{ steps.filter.outputs.grammar }}
      decisions: ${{ steps.filter.outputs.decisions }}
      pending: ${{ steps.filter.outputs.pending }}
      readmes: ${{ steps.filter.outputs.readmes }}
      runtime: ${{ steps.filter.outputs.runtime }}
      playground: ${{ steps.filter.outputs.playground }}
      web_assets: ${{ steps.filter.outputs.web_assets }}
      site: ${{ steps.filter.outputs.site }}
      features: ${{ steps.filter.outputs.features }}
      all: ${{ steps.all.outputs.value }}
      # JSON array of OSes for the `test` matrix. PRs run Linux + Windows; every
      # other event (push to main, merge_group, the weekly schedule) adds macOS,
      # except a stamp commit whose parent already passed macOS (see the step).
      #
      # Windows is on the PR gate because the evidence said it had to be. This
      # leg was Linux-only on PRs until 2026-07-29, on the theory that cross-OS
      # breakage was rare enough to fix forward on `main`. It was not: the last
      # six CI failures on `main` were ALL `Test suite (windows-latest)` — not
      # most, all — and three of the last fifteen merged PRs (#961, #965, #971)
      # were Windows-CI repair work. The gate was letting through the only class
      # of defect that was actually reaching `main`.
      #
      # macOS stays post-merge: it has caught nothing in that window, and macOS
      # runner concurrency is materially tighter than Linux/Windows.
      #
      # The cost, measured rather than guessed: across the last five green
      # three-OS runs the Windows leg took 463-500s against Linux's 156-212s, so
      # a healthy Windows leg is ~8 min and is the slowest job in the pipeline.
      # The legs run in parallel, so the PR gate goes from ~5-6 min to ~8 min —
      # about +2-3 min per PR, paid to stop shipping Windows breakage to `main`.
      # (The old comment here justified the split on macOS billing at 10x and
      # Windows at 2x Linux minutes. That reasoning predates the public flip —
      # GitHub does not bill standard runners on public repos, which is why
      # release.yml's arm64 leg was re-enabled at the same time.)
      test_os: ${{ steps.test-os.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `global` is anchored into every filter that a global change must
          # invalidate; on its own it also drives the `all` short-circuit below.
          filters: |
            global: &global
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            rust:
              - *global
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'clippy.toml'
              - 'deny.toml'
              # The doc gates (doc_examples, doc_diagnostics, doc_version,
              # grammar_coverage, the generated-page drift guards) read the Book
              # and its fixtures, so a content edit must run the Rust test job.
              - 'site/src/content/docs/book/**'
              - 'site/src/diagnostics/**'
              # #2096: xtask's manifest_schema test diffs the committed
              # `bynk.toml` schema (and reads the manifest reference page's
              # example) against the generated one.
              - 'site/public/schemas/**'
              - 'site/src/content/docs/docs/manifest.md'
              # Rust tests that read the VS Code extension's files: scaffolds_compile
              # parses every snippet in snippets/bynk.json; legend_drift
              # (semantic-token legend) and xtask's server_pin read package.json;
              # textmate_keywords checks the TextMate grammar's keyword list. An
              # extension-only edit must run them (#2106).
              - 'vscode-bynk/snippets/**'
              - 'vscode-bynk/package.json'
              - 'vscode-bynk/syntaxes/bynk.tmLanguage.json'
            extension:
              - *global
              - 'vscode-bynk/**'
              # #2102: the web extension bundles the bynk-wasm module, built by
              # scripts/build-wasm.sh.
              - 'bynk-wasm/**'
              - 'scripts/build-wasm.sh'
            grammar:
              - *global
              - 'tree-sitter-bynk/**'
            decisions:
              - *global
              - 'design/decisions/**'
            readmes:
              # The library crates' READMEs carry the crate-layering diagram that
              # readme_layering checks against their Cargo.toml dependencies.
              - *global
              - 'bynk-*/README.md'
            pending:
              # Pending-increment files (increment-allocation track). A change
              # here that touches no Rust would skip the `test` job, so the
              # `drift` job runs the xtask validator in exactly that case.
              - *global
              - 'design/pending/**'
            runtime:
              # The @bynk/runtime sources and the single bundled file bynk-emit
              # embeds via include_str!. The bundled file is a `.ts`, so it is
              # invisible to the `rust` filter — name it explicitly so a one-sided
              # edit still runs the package's typecheck/tests and the drift guard.
              - *global
              - 'bynk-emit/runtime/**'
              - 'bynk-emit/wire-client/**'
              - 'bynk-emit/src/emitter/runtime.ts'
            playground:
              # The in-browser REPL app. Its TypeScript is type-checked against the
              # real wasm-bindgen glue (a debug bynk-wasm build), so a bynk-wasm
              # export change reaching the app is caught — name bynk-wasm too.
              - *global
              - 'playground/**'
              - 'bynk-wasm/**'
              - 'scripts/build-wasm.sh'
            web_assets:
              # The release's bynk-web tarball (release.yml `web-assets`). It gates
              # the GitHub Release, so its packaging path is exercised here rather
              # than first on a tag.
              - *global
              - 'bynk-wasm/**'
              - 'tree-sitter-bynk/**'
              - 'scripts/build-wasm.sh'
              - 'scripts/build-grammar-wasm.sh'
              - 'scripts/package-web-assets.sh'
            site:
              # The Astro/Starlight docs site. Highlighting is fed the editor's
              # TextMate grammar, so a grammar edit must rebuild the site too.
              - *global
              - 'site/**'
              - 'vscode-bynk/syntaxes/bynk.tmLanguage.json'
            features:
              # The Dev Container feature (#2103) and the repo's own
              # .devcontainer/, which runs the feature's install.sh.
              - *global
              - 'features/**'
              - '.devcontainer/**'
      # Collapse "not a PR" (push/schedule) and "a global file changed" into one
      # boolean the downstream `if:`s can OR against. Pinned to the `global`
      # output so a lockfile/toolchain/workflow change fans out to everything.
      - id: all
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.global }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      # Decide the `test` job's OS matrix from the event: Linux + Windows on PRs,
      # all three OSes on everything else (push/main, merge_group, schedule) —
      # except a stamp commit whose code macOS and Windows have already passed.
      #
      # The stamp commit changes no code: it rewrites version strings, the
      # changelog, ADR files and the greenfield table, and stamp.yml already
      # builds the workspace and runs the tests covering exactly those outputs
      # before pushing. So when its parent commit's own CI run passed macOS
      # (and so ran the full three-OS matrix), repeating it on the stamp buys
      # nothing. Both conditions are checked, not assumed:
      #
      #   - It really is the stamp: the `chore(stamp):` prefix AND the stamp
      #     App's bot author, so a squash-merged PR that merely carries that
      #     title still gets the full matrix.
      #   - Its code really was covered: GitHub keeps only one *pending* run per
      #     concurrency group, so two merges close together can leave the first
      #     one's run cancelled, and the stamp's run is then the only one to see
      #     that code. Runs on `main` are serialised (see the concurrency note),
      #     so the parent's run has always finished by now; Linux-only applies
      #     only if it has a successful `Test suite (macos-latest)` job.
      #     Anything else (cancelled, failed, a stamp parent that itself ran
      #     Linux-only, a lookup error) falls back to all three OSes.
      #
      # The stamp commit still completes a full Linux run of its own. Every
      # untrusted value travels via env, never interpolated into the script.
      - id: test-os
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
          PARENT_SHA: ${{ github.event.before }}
        run: |
          three='["ubuntu-latest","macos-latest","windows-latest"]'
          if [ "$EVENT" = "pull_request" ]; then
            echo 'value=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "push" ] || [[ "$HEAD_MESSAGE" != "chore(stamp):"* ]] \
             || [ "$HEAD_AUTHOR" != "bynk-stamp[bot]" ]; then
            echo "value=$three" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$PARENT_SHA&event=push&per_page=1" \
            --jq '.workflow_runs[0].id // empty' || true)"
          macos_ok=0
          if [ -n "$run_id" ]; then
            macos_ok="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Test suite (macos-latest)" and .conclusion == "success")] | length' \
              || echo 0)"
          fi
          if [ "$macos_ok" = "1" ]; then
            echo "Stamp commit; parent $PARENT_SHA passed macOS in run $run_id - Linux only."
            echo 'value=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo "Stamp commit, but parent $PARENT_SHA has no successful macOS run - full matrix."
            echo "value=$three" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Formatting (cargo fmt)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      # No build/cache: rustfmt parses, it doesn't compile.
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Lint (clippy -D warnings)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # --all-targets covers tests/examples/benches, not just the libs/bins.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  api-docs:
    # Guards the /docs/api/ rustdoc the deploy publishes (documentation track
    # follow-on). -D warnings makes a broken intra-doc link fail the build, so the
    # published API docs can't rot; the deploy regenerates the same tree leniently.
    name: API docs (cargo doc)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build the crate API docs (strict)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  test:
    # Matrix across all three host OSes: fixtures compare emitted TypeScript
    # byte-for-byte, so a path-separator / line-ending / tsc-shim difference can
    # pass on Linux and only surface at release. `.gitattributes` forces LF on
    # checkout so the byte comparison is stable on Windows. fail-fast off so one
    # OS's failure doesn't abandon the others' results.
    #
    # bynkc's suite reads the Book (site/src/content/docs/book/**) — the
    # doc_examples compile gate and the reference-page assertions — so the `rust`
    # filter includes the Book content; a content change can legitimately flip a test.
    name: Test suite (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux + Windows on PRs, all three OSes on push/merge_group/schedule —
        # see the `test_os` output on the `changes` job.
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # nextest runs one process pool across every test binary at once (the
      # fixture corpus is dozens of separate binaries `cargo test` would run
      # serially), cutting this leg's wall-clock. Prebuilt binary — no compile.
      # Pinned to the 0.9 line (like typescript@5): this now
      # gates every test run, so a future 0.10 with changed behaviour must not
      # turn CI red with no repo change.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: nextest@0.9
      # #1671: Node 22 (the floor, NODE_MAJOR_FLOOR) so tsc_verify's strip-types
      # checks run here; under BYNK_REQUIRE_TSC they fail rather than skip.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      # `tsc` is needed by the tsc-verify stage and the `bynkc test` fixtures.
      # Pinned to the verified floor, v5 (TYPESCRIPT_MAJOR_FLOOR): an unpinned
      # `typescript` could turn CI red on a new TS major with no repo change.
      # The verified current major, v7, runs as a second pass below (#1672).
      - name: Install TypeScript
        run: npm install -g typescript@5
      # Provision wrangler ONCE, serially, before the suite. The three workerd
      # smokes each shell out to `npx -y wrangler@4 dev`, and they do it
      # concurrently — under nextest every test is its own process in one pool,
      # and events_ordering_workerd.rs starts two workers at once inside a
      # single test. Concurrent `npx -y wrangler@4` installs all land in the
      # SAME `~/.npm/_npx/<hash>` directory (the hash is of the package spec,
      # not the argv), and npm does not lock it. On the v0.245.0 release run
      # (release.yml, same tests, then on `cargo test` with no retries) they
      # raced on a cold cache: npm tore down its own half-extracted tree
      # (`ENOTEMPTY` on rmdir, then a fan of `TAR_ENTRY_ERROR ENOENT`),
      # neither wrangler ever served, and both tests burned the full 180s boot
      # window before failing under BYNK_REQUIRE_WORKERD. This leg's
      # `retries = 1` was hiding the same race here as a FLAKY line rather than
      # a failure. Warming the cache means every test finds a complete cache
      # and installs nothing.
      #
      # The spec must stay in step with the tests' own; a drift guard
      # (bynkc/tests/wrangler/mod.rs) fails if it doesn't.
      #
      # Not fatal off Linux, where the smokes are allowed to skip anyway. On
      # Linux BYNK_REQUIRE_WORKERD makes wrangler mandatory, so a failure here
      # is a real failure and going red now beats going red 180s later.
      - name: Pre-warm the npx cache for wrangler
        run: npx -y wrangler@4 --version
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
      # `cargo nextest run --workspace` runs every crate's suite (no rustdoc
      # doctests exist in the tree, so nextest loses nothing). bynkc's includes:
      #   - doc_examples        — the example-compilation gate (the Book)
      #   - diagnostics_registry / keywords_reference / cli_reference / grammar_reference
      #     — assert the generated reference pages are up to date
      #   - the fixture suite and the tsc-strict verification stage
      # The other crates (bynk-fmt, bynk-lsp, bynk-grammar) contribute their own
      # unit tests.
      # --locked: fail if Cargo.lock would change (no silent lockfile drift).
      # BYNK_REQUIRE_TSC makes a missing `tsc` a hard failure rather than a skip.
      - name: Run tests
        run: cargo nextest run --workspace --locked --profile ci
        env:
          BYNK_REQUIRE_TSC: "1"
          # The workerd smokes (#518) must actually run somewhere: required on
          # Linux, permitted to skip on the other OSes if wrangler cannot boot.
          #
          # The `''` branch does not unset the variable — Actions exports it
          # empty — so a workerd test must read "required" as *non-empty*, not
          # merely present. That contract was got wrong twice (#965 fixed one
          # guard; #971 fixed the identical guard in another test four days
          # later, both only after the breakage had landed on `main`), because
          # each test carried its own copy. It now has exactly one
          # implementation: bynkc/tests/require/mod.rs, which is unit-tested on
          # the empty case specifically. A new workerd test calls that, and the
          # two halves of the contract cannot drift apart again.
          #
          # Deliberately NOT rewritten as a `shell: bash` conditional export.
          # That would make the variable genuinely unset off Linux, but it would
          # also run `cargo nextest` under Git Bash on windows-latest — a path
          # this repo has never exercised, which reorders PATH and makes `which`
          # resolvable, and several `bynkc test` runner paths branch on exactly
          # that. Not worth the risk on the OS we just put on the PR gate.
          BYNK_REQUIRE_WORKERD: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # #1672: the emitted output is verified under both TypeScript majors it
      # supports — the floor (v5, the main run above) and the current one users
      # get from `npm install -g typescript` (v7, here). Linux only: the type-
      # check is OS-independent, and the corpus takes seconds. The version check
      # keeps a failed install from silently re-running the suite under v5.
      # Scope: the two whole-corpus type-check suites, plus the behaviour
      # fixtures (#2146): tsc_verify type-checks with `--noEmit`, so it never
      # sees an error tsc reports only while emitting (a top-level name the
      # module transform reserves), and `bynkc test` emits. That suite takes
      # seconds under v7. The other behaviour suites, which also type-check
      # before running, stay on v5 in CI (re-running them here would roughly
      # double this leg's wall-clock).
      - name: Install TypeScript 7 (the tested major)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install -g typescript@7
          v="$(tsc --version 2>/dev/null || true)"
          case "$v" in
            "Version 7."*) echo "$v" ;;
            *) echo "::error::expected TypeScript 7, got: ${v:-no tsc on PATH}"; exit 1 ;;
          esac
      - name: Type-check emitted output under TypeScript 7
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --profile ci -p bynkc --test tsc_verify --test examples --test behaviour_fixtures
        env:
          BYNK_REQUIRE_TSC: "1"

  msrv:
    # Verify the declared rust-version (Cargo.toml) actually builds, rather than
    # asserting an MSRV nobody checks. If this fails, raise rust-version to match
    # what the code needs — don't lower the toolchain here.
    #
    # The floor rose to 1.95 in the in-browser track's slice 1: `oxc` (behind
    # `bynk-strip`) requires rustc 1.94. 1.95 now equals the pinned
    # `rust-toolchain.toml`, so the dtolnay action (which exports RUSTUP_TOOLCHAIN,
    # outranking the repo file) installs the same toolchain the main legs use —
    # this leg still earns its keep by building `--locked` against the *declared*
    # rust-version, so a future drop below what the code needs goes red here.
    name: MSRV (cargo check on declared rust-version)
    needs: changes
    # Gated on `all` rather than the broad `rust` filter: this leg's job is to
    # verify the *declared* rust-version, which only moves via a manifest edit.
    # `all` is true exactly when a global file changed (Cargo.toml / Cargo.lock /
    # rust-toolchain.toml / a workflow) or the event isn't a PR — so a new or
    # bumped dependency (which touches Cargo.lock) still re-checks the MSRV,
    # while a plain `**/*.rs` PR no longer pays for a redundant full-workspace
    # build (the main 1.95 legs already compile that code on the same toolchain).
    if: needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Derive the toolchain from the *declared* rust-version rather than a
      # hardcoded copy of the pin, so this leg cannot silently degrade into
      # re-running the main toolchain when the two drift apart (#520). Today
      # they coincide (1.95); if rust-version ever falls below what the code
      # needs, this leg is the one that goes red.
      - name: Read declared rust-version
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Tripwire for the `all`-only gate above. That gate is only sound while the
      # declared rust-version equals the pinned dev channel: when they're equal,
      # the main legs already build this code on the same toolchain, so a code-only
      # PR needn't re-run MSRV. The moment they diverge — the normal healthy state
      # once the MSRV is intentionally set below the dev toolchain — a `**/*.rs` PR
      # can start using features newer than the floor with nothing catching it,
      # because MSRV no longer runs on code-only PRs. Fail here (this step runs on
      # exactly the manifest/toolchain PR that would introduce the divergence) with
      # instructions to restore the broad `rust` gate, so the optimisation cannot
      # silently outlive its precondition. Compare on major.minor (rust-version may
      # omit the patch, e.g. "1.95" vs the channel's "1.95.0").
      - name: Guard — declared MSRV still equals the pinned dev toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n1)"
          test -n "$channel" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          mm() { echo "$1" | cut -d. -f1-2; }
          if [ "$(mm "${{ steps.msrv.outputs.version }}")" != "$(mm "$channel")" ]; then
            echo "::error::declared rust-version (${{ steps.msrv.outputs.version }}) no longer matches the pinned toolchain ($channel). The MSRV now differs from the dev toolchain, so a code-only PR can use features newer than the floor undetected. Re-gate the msrv job on 'needs.changes.outputs.rust == true || needs.changes.outputs.all == true' so it runs on every code PR again."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0 (rev only; toolchain comes from `with`)
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Check on MSRV toolchain
        run: cargo check --workspace --locked

  coverage:
    # Report-only (#520): prints a per-crate line/region summary so new
    # fixtures can be aimed at unreached `bynk-check`/`bynk-emit` branches.
    # Deliberately NOT in ci-green's needs and marked continue-on-error —
    # coverage must inform, never gate.
    #
    # Off the PR path deliberately. It cannot block a merge (that is the point
    # of report-only), yet it was spending ~5 min of a runner on every Rust PR.
    # It now reports on pushes to `main` and the weekly schedule, where the
    # summary is just as useful for aiming new fixtures. Note this buys COMPUTE,
    # not latency: it ran in parallel with `test`, so removing it does not
    # shorten the PR gate — `test` still sets the critical path.
    #
    # Off the merge queue for the same reason: the queue's run is followed by
    # the post-merge push run, which reports coverage for the same tree, so a
    # queue run's report is a duplicate that holds a runner (up to ~28 min
    # under contention) while the gating legs wait for one.
    name: Coverage (report-only)
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule')
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # Prebuilt binary — avoids recompiling cargo-llvm-cov from source on every
      # run (minutes of pure build cost on a report-only, continue-on-error job).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary
        run: cargo llvm-cov --workspace --locked --summary-only

  wasm:
    # In-browser track (slice 3): the `syntax → check → emit` pipeline plus the
    # TS→JS strip compile to wasm32 for the playground (`bynk-wasm`). This is a
    # build-gate — it proves the compiler still compiles for the browser target;
    # executing the wasm in a browser/node harness lands with the REPL shell.
    name: wasm32 build (bynk-wasm)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build bynk-wasm for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p bynk-wasm

  playground:
    # Type-check the playground app (the in-browser REPL: editor, sandbox, deep
    # link). It imports `./vendor/bynk_wasm.js` — the generated wasm-bindgen glue —
    # so a debug bynk-wasm build is run first to produce the `.d.ts` the app types
    # against; tsc then verifies the TypeScript. This catches a TS regression or a
    # bynk-wasm export-shape change at PR time, before it can break the deploy
    # workflow (deploy-playground.yml) on main. Cheaper than the deploy build: a
    # debug wasm (no release/wasm-opt), no grammar/emscripten, no upload. The
    # `.scm` highlight query the app imports is an ambient module (src/scm.d.ts),
    # so tsc needs no grammar build. Gated on the `playground` filter, which also
    # fires on bynk-wasm changes — the only Rust that affects the app's types.
    name: Playground (type-check)
    needs: changes
    if: needs.changes.outputs.playground == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # Same version as the wasm-bindgen crate in Cargo.lock, like
      # deploy-playground.yml; xtask/tests/wasm_bindgen_pin.rs checks both.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "20"
      - name: Install deps
        working-directory: playground
        run: npm ci
      - name: Unit tests (node --test)
        working-directory: playground
        run: npm test
      - name: Build the wasm glue (debug — for the .d.ts the app types against)
        working-directory: playground
        run: npm run build:wasm
      - name: Type-check (tsc --noEmit)
        working-directory: playground
        run: npx tsc --noEmit

  web-assets:
    # Build the release's browser-artefacts tarball (scripts/package-web-assets.sh,
    # the same call release.yml makes) and check it holds what the playground's
    # fetch-assets.sh expects. The release job is otherwise only run on a tag, and
    # a failure there blocks the whole GitHub Release.
    name: Browser artefacts (package)
    needs: changes
    if: needs.changes.outputs.web_assets == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # Same version as the wasm-bindgen crate in Cargo.lock, like release.yml.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      - name: Install tree-sitter deps + generate parser
        working-directory: tree-sitter-bynk
        run: |
          npm ci
          npx tree-sitter generate
      - name: Package
        run: scripts/package-web-assets.sh v0.0.0-ci "$RUNNER_TEMP/web-assets"
      - name: The tarball holds what the playground stages
        run: |
          tar tzf "$RUNNER_TEMP/web-assets/bynk-web-v0.0.0-ci.tar.gz" | sort > listing
          cat listing
          for f in bynk_wasm.js bynk_wasm.d.ts bynk_wasm_bg.wasm bynk_wasm_bg.wasm.d.ts \
                   tree-sitter-bynk.wasm highlights.scm VERSION; do
            grep -qx "bynk-web-v0.0.0-ci/$f" listing || { echo "::error::bynk-web tarball is missing $f"; exit 1; }
          done

  site:
    # Build the Astro/Starlight docs site (documentation track). `astro build`
    # runs the static render, the Pagefind search index, and the internal
    # link-checker (starlight-links-validator) — a broken in-site link fails here.
    # Node 22: Astro 7 floors Node at 22.12 (matches the runtime/extension legs).
    # Gated on the `site` filter, which also fires on the tmLanguage grammar the
    # highlighting consumes.
    name: Docs site (astro build)
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      # The sidebar is generated from site/src/SUMMARY.md; fail if the committed
      # sidebar.json drifts from it.
      - name: Check the generated sidebar is current
        run: node scripts/generate-sidebar.mjs --check
      # llms.txt is hand-authored; verify its /book/ links still resolve.
      - name: Check llms.txt links resolve
        run: node scripts/check-llms-links.mjs
      # The Book's ```mermaid diagrams render to inline SVG at build time via
      # rehype-mermaid, which drives a headless Chromium.
      - name: Install Chromium (mermaid)
        run: npx playwright install --with-deps chromium
      - name: Build (astro build — render + Pagefind + link-check)
        run: npm run build

  extension:
    # Build, type-check, bundle, and package the VS Code extension, then assert
    # the bundle has no unresolved external `require` other than `vscode`. This
    # is the gate that would have caught the 0.20.0 packaging crash (a bundled
    # dependency, vscode-languageserver-protocol, missing from the VSIX).
    #
    # #2102: the VSIX also carries the web extension (`"browser"` entry), whose
    # worker runs the bynk-wasm compiler, so this job builds the wasm module
    # (release, as shipped), bundles the web entry, holds it to its budget, and
    # runs the @vscode/test-web smoke suite in headless Chromium.
    name: VS Code extension (build + package)
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vscode-bynk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # Same version as the wasm-bindgen crate in Cargo.lock, like the
      # playground job; xtask/tests/wasm_bindgen_pin.rs checks both.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # @vscode/vsce 4 (the packaging step below) requires Node >= 22.
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Bundle (esbuild)
        run: npm run build
      - name: Smoke — no unbundled external requires
        run: node scripts/check-bundle.mjs
      - name: Build the bynk-wasm module (release)
        run: npm run build:wasm
      - name: Bundle the web extension
        run: npm run build:web
      - name: Smoke — web bundle self-contained and within budget
        run: node scripts/check-bundle.mjs --web
      - name: Install Chromium (@vscode/test-web)
        run: npx playwright install --with-deps chromium
      - name: Web extension smoke tests (@vscode/test-web, headless)
        run: npm run test:web
      - name: Package the VSIX
        # The devDependency `npm ci` installed, so the version lives only in
        # package.json; `--no` refuses to fetch a different one from the registry.
        run: npx --no vsce package --no-dependencies --skip-license

  server-pin:
    # #1673: the VS Code extension's `bynkServerVersion` names the GitHub
    # Release a freshly packaged VSIX downloads `bynkc-lsp` from (the last
    # shipped release; release.yml's `server-pin` job moves it). Unlike the
    # other jobs this one has no path filter: the release can stop being valid
    # without any change in the repo (deleted, flipped to draft, an asset
    # removed), so it runs on every CI run, the weekly schedule included. It is
    # one API call. A failure to reach GitHub is a warning, not a red build.
    name: Extension server pin (release exists)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pin names a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-server-pin.sh

  extension-tests:
    # Launch a real VS Code instance with the extension + a fixture workspace
    # and run the Mocha specs inside the extension host (@vscode/test-electron).
    # This is the only job that exercises runtime *client* behaviour — the class
    # of bug the #143 CodeLens-click crash fell into (it passed tsc, esbuild,
    # the bundle guard, and `vsce package`, yet threw when clicked). The harness
    # needs a locally-built `bynkc-lsp` on PATH (so activation never hits the
    # download path) and, on Linux, a virtual display (xvfb).
    #
    # Gated on `rust` as well as `extension`: it builds bynk-lsp from source, so
    # a server change must re-run the client integration suite.
    name: VS Code extension (integration tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.extension == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The pinned VS Code build the suite runs against — `runTest.ts` reads this
      # and the cache below keys on it (one source of truth). Pinned to the recent
      # stable the suite was already testing against; bump here to test a newer one.
      VSCODE_TEST_VERSION: "1.140.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build the language server + compiler + driver
        # `bynkc-lsp` for the LSP tests; `bynkc` + `bynk` for the check/test/debug
        # paths, which now shell `bynk` rather than `bynkc` directly (#486) — all
        # three land on PATH via runTest.ts (DECISION D).
        run: cargo build --release -p bynk-lsp -p bynkc -p bynk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # ≥ 22.6 for the debug paths — the emitted `.ts` runs under Node's
          # TypeScript type-stripping (`--experimental-strip-types`).
          node-version: "22"
      - name: Install deps
        working-directory: vscode-bynk
        run: npm ci
      # Cache the downloaded VS Code build so the network "Resolving version…"
      # + download (the ECONNRESET-prone step) runs at most once per pinned
      # version. `@vscode/test-electron` caches into `vscode-bynk/.vscode-test`.
      - name: Cache the VS Code test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode-bynk/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}
      - name: Integration tests (xvfb)
        working-directory: vscode-bynk
        run: xvfb-run -a npm test

  grammar:
    # Run the tree-sitter corpus so grammar drift fails a PR. Without this the
    # grammar is only ever `generate`d (at npm-publish time), never `test`ed.
    name: tree-sitter grammar (corpus)
    needs: changes
    if: needs.changes.outputs.grammar == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tree-sitter-bynk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Generate parser
        run: npx tree-sitter generate
      # `src/parser.c`, `src/grammar.json` and `src/node-types.json` are
      # GENERATED but COMMITTED. Nothing else checks that the committed copies
      # match what grammar.js currently produces, and `grammar.json` is what the
      # Book's grammar appendix is rendered from — so a grammar.js edit whose
      # regenerated output was never committed would leave the appendix silently
      # describing the old grammar, with its own drift guard blessing it.
      #
      # Expect this to go red on Dependabot `tree-sitter-cli` bumps, when a new
      # CLI generates the parser (or the vendored `src/tree_sitter/*.h`)
      # differently. That is the guard working: commit the regenerated output.
      - name: Committed parser matches grammar.js
        run: git diff --exit-code -- src/
      - name: Test corpus
        run: npx tree-sitter test

  runtime:
    # The @bynk/runtime package: focused TypeScript modules that are bundled
    # into the single `bynk-emit/src/emitter/runtime.ts` the compiler embeds via
    # include_str!. This job gives the runtime first-class treatment that the
    # Rust crate can't: isolated `tsc` type-checking and unit tests (the JWT and
    # webhook crypto seams especially), then the drift guard — `bundle --check`
    # rebuilds the flat file in memory and fails if it differs from the committed
    # artifact, so a stale runtime.ts can never merge. cargo build stays Node-free.
    name: Runtime package (@bynk/runtime)
    needs: changes
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bynk-emit/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # ≥ 22 so `node --test` runs the `.ts` suite directly under TypeScript
          # type-stripping, matching the emitted runtime's own execution model.
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Drift guard (bundled runtime.ts is up to date)
        run: npm run check

  drift:
    # The two cross-component drift guards read files that live OUTSIDE the
    # `rust` filter, so the main `test` job's gate doesn't cover a one-sided
    # change to them:
    #   - bynkc/tests/grammar_reference.rs reads tree-sitter-bynk/src/grammar.json
    #     (a `grammar` input) and asserts the Book's reference/grammar-appendix.md
    #     still matches the rendered EBNF;
    #   - bynk-lsp/tests/legend_drift.rs reads vscode-bynk/package.json (an
    #     `extension` input) and asserts the semantic-token legend names match.
    #   - bynkc/tests/decisions_index.rs reads design/decisions/**.md (a
    #     `decisions` input) and asserts decisions/README.md indexes every ADR.
    #   - bynkc/tests/readme_layering.rs reads bynk-*/README.md (a `readmes`
    #     input) and asserts the crate-layering diagram matches the manifests.
    #   - xtask validates design/pending/**.md (a `pending` input) against the
    #     pending-increment format (increment-allocation track).
    #   - xtask/tests/manifest_schema.rs reads vscode-bynk/package.json (an
    #     `extension` input) and asserts it associates the `bynk.toml` schema.
    # This job runs them exactly when `test` would NOT but a drift input changed,
    # so a guard can never be skipped — and there is no duplicate run when `test`
    # already executes them (the `if` is the complement of `test`'s gate). The
    # guards are OS-independent and need no node/tsc, so one runner suffices.
    name: Cross-component drift guards
    needs: changes
    if: >-
      (needs.changes.outputs.grammar == 'true' || needs.changes.outputs.extension == 'true'
        || needs.changes.outputs.decisions == 'true' || needs.changes.outputs.pending == 'true'
        || needs.changes.outputs.readmes == 'true')
      && needs.changes.outputs.rust != 'true'
      && needs.changes.outputs.all != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # Left on `cargo test` (not nextest): each guard is a single test binary,
      # so nextest's cross-binary parallelism buys nothing here, and adding its
      # install step would only tax the cheap grammar/extension/decisions PRs
      # this job exists for.
      - name: Grammar appendix ↔ tree-sitter grammar
        run: cargo test -p bynkc --test grammar_reference
      - name: LSP legend ↔ extension package.json
        run: cargo test -p bynk-lsp --test legend_drift
      - name: Decision-record index ↔ ADR files
        run: cargo test -p bynkc --test decisions_index
      - name: Crate-layering diagram ↔ crate manifests
        run: cargo test -p bynkc --test readme_layering
      - name: Pending-increment files ↔ format; bynk.toml schema ↔ extension
        run: cargo test -p xtask

  audit:
    # Scans Cargo.lock against the RustSec advisory database. Only the lockfile
    # and manifests matter here, both of which live in the `rust`/`global`
    # filters; the weekly schedule (an `all` run) catches advisories published
    # after a PR merges.
    name: Security audit (cargo audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Define the toolchain explicitly (rust-toolchain.toml would otherwise
      # trigger an implicit download when `cargo audit` dispatches in-repo).
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      # Prebuilt binary — avoids compiling cargo-audit from source on every run.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  deny:
    # Licence-policy enforcement, duplicate/wildcard detection, and source
    # allowlisting (deny.toml). Complements `audit` — advisories overlap by
    # design (defence in depth); the unique value is licences + bans + sources.
    name: Supply chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  npm-audit:
    # Audit every npm package's dependency tree against the npm advisory DB —
    # the JS-side parallel of `cargo audit`, closing the un-audited dependency
    # surface. Reads the committed lockfiles (no install). A high-severity
    # advisory gates; low/moderate are signal, not a blocker. Covers all five
    # trees with committed lockfiles, including playground/site whose deploy jobs
    # hold the Cloudflare token.
    #
    # The gate is `scripts/npm-audit-gate.mjs`: `npm audit --json`, failing on any
    # high/critical advisory except one listed for that tree in
    # `scripts/npm-audit-allowlist.json`. The allowlist is only for advisories
    # with no patched release; each entry carries a `review_by` date past which
    # it stops exempting. `vscode-bynk` audits its shipped (non-dev) tree: its dev
    # dependencies are packaging tools that never reach the published extension.
    name: Security audit (npm)
    needs: changes
    if: needs.changes.outputs.extension == 'true' || needs.changes.outputs.grammar == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.playground == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [vscode-bynk, tree-sitter-bynk, bynk-emit/runtime, playground, site]
        include:
          - package: vscode-bynk
            audit_args: "--omit=dev"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "20"
      - name: Audit
        env:
          TREE: ${{ matrix.package }}
          AUDIT_ARGS: ${{ matrix.audit_args }}
        # AUDIT_ARGS is deliberately unquoted: empty for most trees, one flag for vscode-bynk.
        run: node scripts/npm-audit-gate.mjs "$TREE" -- $AUDIT_ARGS

  dependency-review:
    # On PRs, flag newly-introduced dependencies that carry known advisories or
    # disallowed licences before they merge. Complements Dependabot (which acts
    # after merge).
    #
    # Gated on repository visibility: the dependency-review API needs GitHub
    # Advanced Security on private repos, so until the v1.0.0 public flip this
    # job would error on every PR. The gate self-heals — the job starts
    # running the moment the repo goes public, no workflow edit needed.
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  devcontainer-feature:
    # #2103: build each scenario in features/test/bynk/scenarios.json with the
    # devcontainer CLI and run its checks, including `bynk doctor --strict`
    # with the Node feature. It installs a real GitHub Release and real npm
    # packages, so it runs when the feature changes and on the weekly schedule
    # (a new release, wrangler or TypeScript can break it with no repo change),
    # not on every push to `main`. `--skip-autogenerated`: the autogenerated
    # test runs the defaults on a base image with no Node, which fails by
    # design (wrangler and typescript default on). Nothing is published here;
    # devcontainer-feature-publish.yml does that, on a release.
    name: Dev Container feature (test)
    needs: changes
    if: needs.changes.outputs.features == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      - name: Test the feature
        run: npx --yes @devcontainers/cli@0.89.0 features test --project-folder features --features bynk --skip-autogenerated

  # ---------------------------------------------------------------------------
  # Early signal, so a PR can be marked ready for review without waiting on the
  # leg that dominates the run. This job gates NOTHING: `ci-green` below is
  # still the only required status check, and this one must not be added to the
  # ruleset — it would be redundant (ci-green needs it) and would turn a
  # deliberately partial signal into a merge blocker.
  #
  # The boundary is "everything except the two test legs", and it sits there
  # because that is where the time is. Measured on run 2822 — an `all == true`
  # PR, so every job actually ran:
  #
  #     Test suite (windows-latest)              465s  ─┐
  #     Test suite (ubuntu-latest)               208s   ├─ NOT in ci-fast
  #     VS Code extension (integration tests)    197s  ─┘
  #     Docs site (astro build)                   62s  ← ci-fast's slowest
  #     Playground (type-check)                   55s
  #     Supply chain (cargo-deny)                 54s
  #     …13 more, every one under a minute
  #
  # So this reports at ~70s where `ci-green` reports at ~480s. The Claude PR
  # review's median run is 4.1 min, which fits inside the Windows leg with room
  # to spare — marking ready off THIS signal makes the review effectively free
  # wall clock, where waiting for `ci-green` spends ~8 min before the review
  # even starts. It still answers the question that made waiting attractive in
  # the first place: a review never opens on code that fails fmt or clippy.
  #
  # This job is deliberately a SUBSET, and deliberately NOT covered by
  # `ci-green`'s audit. A job added to the workflow does not need adding here —
  # `ci-green`'s audit is what guarantees the real gate stays complete, and
  # quietly growing this list with slow jobs would blunt the signal it exists
  # to give. Adding something here is a judgement call about latency, not a
  # correctness obligation.
  # ---------------------------------------------------------------------------
  ci-fast:
    name: CI fast gates
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - api-docs
      - msrv
      - wasm
      - playground
      - site
      - extension
      - server-pin
      - grammar
      - runtime
      - drift
      - audit
      - deny
      - npm-audit
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same "a skipped job is a pass" semantics as `ci-green`: the path filters
      # make skipping the normal case on a scoped PR, so only a real failure or
      # a cancellation may go red. No checkout — unlike `ci-green` this job
      # reads no files.
      - name: Verify no fast gate failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A fast gate reported '$r'."
              exit 1
            fi
          done
          echo "Fast gates passed. The test legs may still be running — merging still waits on CI green."

  ci-green:
    # Single required status check. Branch protection requires THIS job and
    # nothing else, so the path-gated jobs above can skip freely and renaming
    # one no longer desyncs the ruleset. `if: always()` makes it report even
    # when upstreams are skipped or fail; it goes red only if a needed job
    # actually failed or was cancelled (a skipped job is a pass).
    name: CI green
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - api-docs
      - test
      - msrv
      - wasm
      - playground
      - web-assets
      - site
      - extension
      - server-pin
      - extension-tests
      - grammar
      - runtime
      - drift
      - audit
      - deny
      - npm-audit
      - dependency-review
      - devcontainer-feature
      # Needed rather than exempted: it makes `ci-green` subsume the fast tier
      # (so a `ci-fast` that fails on its own — a broken expression, say — still
      # goes red on the required check), and it satisfies the audit below with
      # no EXEMPT entry. It costs no latency: `ci-green` already waits on every
      # job `ci-fast` waits on, plus the two slower test legs.
      - ci-fast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The `needs:` list above is the whole gate, and it is hand-maintained: a
      # job added to this workflow without a matching entry silently stops
      # gating, and nothing about the PR looks wrong. Compare the workflow's job
      # keys against the keys of `needs` (taken from the context at runtime, so
      # only the job list is parsed out of the file) and fail on any job that is
      # neither needed nor deliberately exempt.
      #
      # EXEMPT is the honest record of what does not gate: `coverage` is
      # report-only by design (#520), and `ci-green` cannot need itself.
      - name: Every job is gated (or explicitly exempt)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          EXEMPT="coverage ci-green"
          jobs="$(sed -n '/^jobs:$/,$p' .github/workflows/ci.yml \
                  | sed -n 's/^  \([a-z][a-z0-9-]*\):$/\1/p')"
          needed="$(printf '%s' "$NEEDS" | jq -r 'keys[]')"
          missing=""
          for j in $jobs; do
            case " $EXEMPT " in *" $j "*) continue ;; esac
            printf '%s\n' $needed | grep -qx "$j" || missing="$missing $j"
          done
          if [ -n "$missing" ]; then
            echo "::error::job(s) not in ci-green's needs, so they gate nothing:$missing. Add them to needs:, or to EXEMPT in this step with a reason."
            exit 1
          fi
          echo "All jobs are gated or exempt."
      - name: Verify no upstream job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::An upstream job reported '$r'."
              exit 1
            fi
          done
          echo "All upstream jobs succeeded or were skipped."
