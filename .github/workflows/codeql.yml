name: CodeQL

# Static analysis (SAST) over the TypeScript (the embedded runtime — a real
# file since v0.48, so the Bearer JWT verifier is now in scope) and the Rust
# compiler. Free on this public repo; satisfies the
# OpenSSF Scorecard SAST check. SHA-pinned, the repo's posture (ADR 0087).
#
# CodeQL's load-bearing coverage here is the TypeScript surface; the Rust leg is
# maturing — defense-in-depth over what `clippy` + the type system already give.
# The *behavioral* guard for the emitted auth verifier is the bearer-auth test
# (`bynk-tests/tests/bearer_auth.rs`), not SAST — see ADR 0087.

on:
  # SAST analyses only Rust + TypeScript, so skip docs/design/markdown-only
  # changes — they cannot affect the analysed code, and re-analysing an
  # unchanged tree is wasted CI. The nightly `schedule` below stays unfiltered
  # so the default-branch baseline is always refreshed regardless. A mixed change
  # (any non-ignored path also touched) still runs.
  push:
    branches: [main]
    paths-ignore: &non_code_paths
      - "docs/**"
      - "design/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore: *non_code_paths
  schedule:
    # Nightly at 07:40 UTC, 40 min after ci.yml's scheduled run. The only run
    # that analyses Rust (see the matrix); it was a weekly drift check before.
    - cron: "40 7 * * *"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip the stamp commit's push. It changes no code (version strings, the
    # changelog, ADR files, the greenfield table — but it touches Cargo.toml and
    # package.json, so the paths filter alone does not exclude it), and this
    # analysis already ran on its parent. Identified as ci.yml identifies it:
    # the `chore(stamp):` prefix AND the stamp App's bot author, so a
    # squash-merged PR that merely carries that title is still analysed. No
    # concurrency group here, so a skipped run displaces no real one.
    if: >-
      github.event_name != 'push'
      || !startsWith(github.event.head_commit.message, 'chore(stamp):')
      || github.event.head_commit.author.name != 'bynk-stamp[bot]'
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is analysed on the nightly only; pull requests and pushes to
        # `main` analyse TypeScript. The Rust leg autobuilds the whole workspace
        # (~8 min p50) on a hosted runner and is not a required check. It ran
        # on every code PR (212 runs in two days in November 2026) and then on
        # every merge's push, competing for the same hosted slots as the merge
        # queue. Nightly, a Rust finding surfaces within a day, which suits
        # defence-in-depth over clippy and the type system (see the header).
        # The TypeScript leg stays on every event: it is quick, it covers the
        # emitted runtime (the surface CodeQL is load-bearing for), it
        # annotates new alerts on the PR diff, and it keeps OpenSSF Scorecard's
        # SAST check seeing CodeQL on merged PRs.
        #
        # Trade-offs, accepted: `main` holds a Rust configuration that PR runs
        # never upload, so code scanning's PR check may note that it cannot
        # determine the alerts introduced for "1 configuration present on
        # refs/heads/main" (rust). That is a notice, not a block, unless
        # code-scanning merge protection is ever turned on in a ruleset (then
        # revisit this). And a merge that fixes or introduces a Rust alert
        # shows on `main` only after the next nightly.
        language: ${{ fromJSON(github.event_name == 'schedule' && '["javascript-typescript","rust"]' || '["javascript-typescript"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}

      # JS/TS needs no build; Rust autobuild runs `cargo build`.
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
