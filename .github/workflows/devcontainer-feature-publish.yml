name: Dev Container feature (publish)

# Publishes features/src/bynk to GHCR as ghcr.io/bynk-lang/features/bynk
# (#2103, DECISION A: the feature lives in this repo and is published on a
# release, so it stays in step with the releases it installs).
#
# Triggers:
#
#   - `workflow_run` on a completed Release run. release.yml creates the GitHub
#     Release with the workflow GITHUB_TOKEN, and GitHub does not start new runs
#     for events that token causes, so `on: release` would never fire here.
#     Only a successful, tag-pushed Release run counts (not the manual
#     registry-retry dispatch, which cuts no release).
#   - `workflow_dispatch`, from `main` only, as the retry path.
#
# There is deliberately no `pull_request` or `push` trigger, and the job's `if:`
# re-checks the event and ref, so nothing on a PR branch can publish.
#
# A `workflow_run` run uses this file as it is on the default branch, and the
# checkout below is that same branch (`main`), never the triggering run's
# head_sha: checking out a workflow_run's commit is the pattern Scorecard's
# Dangerous-Workflow check flags. The feature is versioned by
# devcontainer-feature.json, so publishing from the tip of `main` is equivalent.
#
# devcontainers/action publishes the version in devcontainer-feature.json and
# skips one GHCR already has. Bump that version for a change users should get.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: devcontainer-feature-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test the feature
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Test the feature
        run: npx --yes @devcontainers/cli@0.89.0 features test --project-folder features --features bynk --skip-autogenerated

  publish:
    name: Publish to GHCR
    needs: test
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the feature's OCI artifact to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./features/src
          features-namespace: bynk-lang/features
          devcontainer-cli-version: "0.89.0"
          # The action would otherwise push a git tag per feature version,
          # which needs `contents: write`.
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
