# TEMPORARY diagnostic for #4579 (why `wrangler dev` logs `Ready on` ~2 min after boot on
# Windows and ~5 s on Linux). Not part of the final diff: removed before the PR is ready.
name: diag-4579
on:
  push:
    branches: [claude/l18-4579]
  workflow_dispatch:
permissions: {}
jobs:
  boot:
    name: wrangler boot timing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Pre-warm the npx cache for wrangler
        run: npx -y wrangler@4 --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot like bynk-tests (file output, registry, inspector), alone and concurrently
        run: |
          node .github/diag-4579/boot.mjs single-registry 1
          node .github/diag-4579/boot.mjs single-no-registry 1 --no-registry
          node .github/diag-4579/boot.mjs single-registry-debug 1 --log-level debug
          node .github/diag-4579/boot.mjs concurrent-4 4
          node .github/diag-4579/boot.mjs concurrent-8 8
