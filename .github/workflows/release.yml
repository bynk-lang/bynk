name: Release

# Tag-driven release. Pushing a version tag matching the manifests does the
# whole release in one shot:
#
#     git tag v0.16.0 && git push origin v0.16.0
#
#   -> verify (tag/version match + on-main) -> the test suite on all three OSes
#      -> build binaries + cut the GitHub
#      Release, AND publish the crates to crates.io and the grammar to npm
#      (both via OIDC Trusted Publishing, both re-run-safe — a version already
#      on a registry is skipped, so a partial publish can be retried by
#      re-running the run). Once the GitHub Release exists, it also tells the
#      bynk-lang org canary (the `canary` job).
#
# The repo carries a single version across all manifests (see design/README.md
# "Versioning & release"): the increment PR runs scripts/bump-version.sh, and a
# release tag is cut when a version is to be shipped. The VS Code extension
# has its own repository and version line (bynk-lang/vscode-bynk); it is
# enrolled in the org canary, so the `canary` job below also tells it about each
# release, and its pin-bump workflow moves its bynkServerVersion pin.
#
# The registry publishes are irreversible. The `verify` + `test` gates (the
# tag/version match, the tagged commit being on `main`, and a green suite on
# all three host OSes) stand in for an approval gate. Tags are NOT covered by the `main` ruleset, so the on-main
# ancestry check RAISES THE BAR against a `v*` tag (or a manual dispatch from a
# branch) releasing an unreviewed commit — see #730. It is a partial mitigation,
# not the whole fix: a tag-triggered (or branch-dispatched) run executes the
# workflow definition FROM THE TAGGED COMMIT, so an attacker who authors that
# commit can strip this check before it runs. What the ancestry gate does stop
# is tagging an *existing, honest* commit that never reached `main` (e.g. an
# unmerged PR-branch head that still carries this workflow). Closing the residual
# needs the deferred `v*` tag ruleset (restrict tag creation to the maintainer)
# and, once the repo is public, an Environment with required reviewers for a
# one-click pause — the latter tracked separately because it needs the
# crates.io/npm Trusted Publishers re-registered with that environment, since
# they are wired with "no environment" below (see the publish-jobs notes).
#
# A manual `workflow_dispatch` (Actions tab "Run workflow", or
# `gh workflow run release.yml --ref v0.16.0 -f publish_crates=true
# -f publish_npm=true`) re-runs just the registry publishes against the tag ref —
# the override / retry path. Pre-release tags like v0.16.0-rc1 work too.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      publish_crates:
        description: "Publish the crates to crates.io"
        type: boolean
        default: true
      publish_npm:
        description: "Publish the tree-sitter grammar to npm"
        type: boolean
        default: true

# Never run two releases for the same tag at once, and don't cancel one midway
# (publishing to crates.io/npm is irreversible).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # least-privilege default; the github-release job requests contents: write for itself

jobs:
  # Gate every publish on a green test run AND on the tag matching the version
  # baked into the manifests — so you can't accidentally ship v0.17.0 from a
  # tree that still says 0.16.0. "The manifests" is every versioned site in
  # the repo (single-version posture): the Cargo workspace and both npm
  # packages. The extension's bynkServerVersion pin is not one of them: it names
  # the last shipped release (#1673), so here it must name a published release,
  # which on a tagged commit is the *previous* one.
  verify:
    name: Verify (tag/version + on-main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the on-main ancestry check below can resolve
      # No Rust toolchain or tsc here any more: the test run moved to the
      # cross-OS `test` job below, and what is left reads manifests (`node -p`)
      # and walks history, so this leg stays cheap.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Check tag/version match
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          ts="$(node -p "require('./tree-sitter-bynk/package.json').version")"
          fail=0
          test "$ts" = "$ver" || { echo "::error::tree-sitter-bynk version $ts does not match workspace version $ver"; fail=1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"   # strip leading v
            base="${tag%%-*}"            # drop any -rc1 / -beta suffix
            echo "ref=tag $GITHUB_REF_NAME  manifest=$ver"
            test "$base" = "$ver" || { echo "::error::tag $GITHUB_REF_NAME does not match workspace version $ver"; fail=1; }
          else
            echo "::notice::manual dispatch from $GITHUB_REF_NAME — will publish manifest version $ver"
          fi
          exit "$fail"
      - name: Commit under release must be on main (reviewed)
        # `v*` tags are NOT covered by the `main` ruleset, so a tag can be pushed
        # at ANY commit on ANY branch, and a manual dispatch can run from a branch
        # ref too. The tag/version match above never checks *which commit* is
        # being shipped. Requiring the released commit ($GITHUB_SHA) to be an
        # ancestor of origin/main means an *existing, honest* off-main commit
        # (e.g. an unmerged PR-branch head) can't be released without first
        # reaching main through branch protection. Every publish job has
        # `needs: [verify, test]`, so failing here blocks the release (tag push
        # AND dispatch). This is a PARTIAL mitigation: a tag-triggered run executes
        # this workflow from the tagged commit, so an attacker who authors that
        # commit can strip this check — closing that needs the deferred `v*` tag
        # ruleset (see the header). #730.
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::notice::$GITHUB_SHA is on origin/main"
          else
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main — refusing to release an unreviewed commit"
            exit 1
          fi
  # The test suite, on every OS a release actually ships a binary for.
  #
  # This used to be a step inside `verify`, on ubuntu-latest alone — so a release
  # published Windows and macOS binaries from a tree whose suite had never been
  # run on Windows or macOS. That is the same gap ci.yml's PR matrix had, with a
  # larger blast radius: the last six CI failures on `main` were all the Windows
  # leg, and the release gate could not have seen any of them. Split out here so
  # `verify` stays a fast tag/version/ancestry check and the publish jobs can
  # depend on both.
  test:
    name: Test suite (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # #1676: the release gate runs the suite exactly as the PR gate does —
      # nextest under the shared `ci` profile (.config/nextest.toml), one
      # process per test and the same retry policy — so a test that passes CI
      # cannot fail here for a harness reason. Same install, same pin as ci.yml.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: nextest@0.9
      # #1671: Node 22 (the floor, NODE_MAJOR_FLOOR) so tsc_verify's strip-types
      # checks run here; under BYNK_REQUIRE_TSC they fail rather than skip.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      # Range-pinned to major 5, as in the verify job above — see #828.
      - name: Install TypeScript
        run: npm install -g typescript@5
      # Provision wrangler ONCE, serially, before the suite. The three workerd
      # smokes each shell out to `npx -y wrangler@4 dev`, and they do it
      # concurrently — under nextest every test is its own process in one pool,
      # and events_ordering_workerd.rs starts two workers at once inside a
      # single test. Concurrent `npx -y wrangler@4` installs all
      # land in the SAME `~/.npm/_npx/<hash>` directory (the hash is of the
      # package spec, not the argv), and npm does not lock it: on the v0.245.0
      # release run they raced on a cold cache, npm tore down its own
      # half-extracted tree (`ENOTEMPTY` on rmdir, then a fan of
      # `TAR_ENTRY_ERROR ENOENT`), neither wrangler ever served, and both tests
      # burned the full 180s boot window before failing under
      # BYNK_REQUIRE_WORKERD — a red release from a green tree. Warming the
      # cache here means every test finds a complete cache and installs nothing.
      #
      # The spec must stay in step with the tests' own; a drift guard
      # (bynkc/tests/wrangler/mod.rs) fails if it doesn't.
      #
      # Not fatal off Linux, where the smokes are allowed to skip anyway. On
      # Linux BYNK_REQUIRE_WORKERD makes wrangler mandatory, so a failure here
      # is a real failure and going red now beats going red 180s later.
      - name: Pre-warm the npx cache for wrangler
        run: npx -y wrangler@4 --version
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
      - name: Run tests
        run: cargo nextest run --workspace --locked --profile ci
        env:
          BYNK_REQUIRE_TSC: "1"
          # Empty off Linux, and empty means "not required" — the contract lives
          # in bynkc/tests/require/mod.rs. See the longer note in ci.yml,
          # including why this is not a `shell: bash` conditional export.
          BYNK_REQUIRE_WORKERD: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  # Build native binaries on each host (no cross-compilation). fail-fast off so
  # one platform's failure doesn't abandon the others' artifacts.
  binaries:
    name: Build ${{ matrix.target }}
    needs: [verify, test]
    if: github.event_name == 'push' # tag push only — not the manual registry-publish dispatch
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # arm64 Linux: the free `ubuntu-24.04-arm` runners serve public
          # repos — re-enabled at the public flip (June 2026).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: ${{ matrix.target }}
      # #2463: `bynk book` embeds the Book (site/public/llms-full.txt, via
      # bynk/build.rs); the generator needs only Node's standard library.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Generate the Book bundle `bynk book` embeds
        run: node site/scripts/build-llms-full.mjs
      - name: Build bynkc + bynk + bynkc-lsp
        run: cargo build --release --locked --target ${{ matrix.target }} -p bynkc -p bynk -p bynk-lsp

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          stage="bynk-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$stage"
          cp "$bin/bynkc" "$bin/bynk" "$bin/bynkc-lsp" LICENSE-MIT LICENSE-APACHE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          # Raw binaries for the VS Code extension's download-on-activate (it
          # fetches single verified files, no archive extraction): the server,
          # plus the `bynk` driver and `bynkc` compiler it puts on PATH.
          cp "$bin/bynkc-lsp" "bynkc-lsp-${{ matrix.target }}"
          cp "$bin/bynk" "bynk-${{ matrix.target }}"
          cp "$bin/bynkc" "bynkc-${{ matrix.target }}"
          echo "ASSET=$stage.tar.gz" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          $stage = "bynk-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$bin/bynkc.exe","$bin/bynk.exe","$bin/bynkc-lsp.exe","LICENSE-MIT","LICENSE-APACHE" $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Copy-Item "$bin/bynkc-lsp.exe" "bynkc-lsp-${{ matrix.target }}.exe"
          Copy-Item "$bin/bynk.exe" "bynk-${{ matrix.target }}.exe"
          Copy-Item "$bin/bynkc.exe" "bynkc-${{ matrix.target }}.exe"
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            bynkc-lsp-${{ matrix.target }}*
            bynk-${{ matrix.target }}*
            bynkc-${{ matrix.target }}*
          if-no-files-found: error

  # The compiler's browser artefacts: the bynk-wasm module + glue and the
  # tree-sitter grammar wasm, as one bynk-web-<tag>.tar.gz. The playground
  # (bynk-lang/playground) builds from this at a pinned release instead of
  # building the compiler itself (its scripts/fetch-assets.sh), so it can live
  # and iterate on its own cadence. Pre-release tags build it too: a break found
  # at -rc1 is a break found early. Same toolchain pins as ci.yml.
  web-assets:
    name: Build the browser artefacts
    needs: [verify, test]
    if: github.event_name == 'push' # tag push only — not the manual registry-publish dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # Same version as the wasm-bindgen crate in Cargo.lock; see ci.yml.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      # wasm-opt (binaryen) shrinks the module (-Oz, the size budget);
      # build-wasm.sh applies it only when present.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Install tree-sitter deps + generate parser
        working-directory: tree-sitter-bynk
        run: |
          npm ci
          npx tree-sitter generate
      - name: Package
        run: scripts/package-web-assets.sh "$GITHUB_REF_NAME" web-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-assets
          path: web-assets/bynk-web-*.tar.gz
          if-no-files-found: error

  # #2321: the registry's admission rules as a standalone wasm32 module, so the
  # hosted registry (and anyone) can pin a released copy. A plain C ABI, one
  # file, no glue. Attached to the release as `bynk_registry_core-<tag>.wasm`.
  registry-core-wasm:
    name: Build the registry admission module
    needs: [verify, test]
    if: github.event_name == 'push' # tag push only - not the manual registry-publish dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build
        run: scripts/build-registry-core.sh
      - name: Name it for the tag
        run: |
          mkdir registry-core
          cp target/registry-core/bynk_registry_core.wasm "registry-core/bynk_registry_core-${GITHUB_REF_NAME}.wasm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry-core-wasm
          path: registry-core/bynk_registry_core-*.wasm
          if-no-files-found: error

  # The compiler-owned facts the VS Code extension checks itself against
  # (reserved keywords, semantic-token legend), as
  # `bynk-editor-contract-<tag>.json`. The extension pins a server release and
  # verifies its TextMate grammar and package.json against this asset instead of
  # reading the compiler's sources, so it can live in its own repository
  # (design/vscode-extension-extraction.md §4). Pre-release tags publish it too.
  editor-contract:
    name: Build the editor contract
    needs: [verify, test]
    if: github.event_name == 'push' # tag push only — not the manual registry-publish dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Generate
        run: |
          mkdir editor-contract
          cargo run -q -p xtask -- editor-contract --tag "$GITHUB_REF_NAME" --out "editor-contract/bynk-editor-contract-${GITHUB_REF_NAME}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: editor-contract
          path: editor-contract/bynk-editor-contract-*.json
          if-no-files-found: error

  # Collect every platform's archive and the browser artefacts, checksum them,
  # attest build provenance, and attach everything to one GitHub Release.
  github-release:
    name: Publish GitHub Release
    needs: [binaries, web-assets, registry-core-wasm, editor-contract]
    if: github.event_name == 'push' # tag push only — not the manual registry-publish dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release + upload assets
      id-token: write # OIDC for build-provenance attestation
      attestations: write # record the attestation
    steps:
      # For scripts/install.{sh,ps1}, attached to the Release so
      # `…/releases/latest/download/install.sh` is a stable install URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
      # One SHA256SUMS over the archives AND the raw binaries (basenames, so
      # they match the flat asset names a consumer downloads). The VS Code
      # extension's download-on-activate verifies `bynkc-lsp-<target>`,
      # `bynk-<target>` and `bynkc-<target>` against this file. Each artifact
      # directory holds exactly the files to publish, so `*/*` is the lot.
      - name: Checksums
        working-directory: dist
        run: |
          shopt -s globstar nullglob
          files=(*/*)
          sha256sum "${files[@]}" | awk '{ n = $2; sub(/.*\//, "", n); print $1 "  " n }' > SHA256SUMS
          cat SHA256SUMS
      # Signed SLSA provenance for each archive and raw binary (verifiable with
      # `gh attestation verify`). Subject is the artefacts, not the sums file.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*/*"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*/*
            dist/SHA256SUMS
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Tell the bynk-lang org canary that this release exists. The canary
  # (bynk-lang/.github, canary/README.md) re-runs every enrolled example and
  # action repository's checks against it, and opens an issue in any it
  # breaks. Without this, it runs only weekly, on a schedule GitHub disables
  # after 60 days without activity in that repository.
  #
  # `repository_dispatch` needs a token with Contents: write on the target, and
  # GITHUB_TOKEN can't reach another repository, so the token comes from a
  # bynk-lang GitHub App installed on bynk-lang/.github alone. The job
  # checks out nothing and runs no crate or npm code: it mints the token and
  # makes one API call (#727). The token is scoped to that
  # one repository and to `contents: write`.
  #
  # Pre-release tags are sent too: a break found at -rc1 is a break found early.
  #
  # The release is already published when this runs, so a failure here doesn't
  # undo anything; it only means the canary must be run by hand
  # (`gh workflow run dispatch-canary.yml -R bynk-lang/.github -f version=X.Y.Z`).
  # Until the App's secrets are set, the job warns and skips.
  canary:
    name: Notify the org canary
    needs: github-release
    if: github.event_name == 'push' # a tag push; the GitHub Release exists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {} # the App token does the dispatching
    steps:
      - name: Check the App secrets
        id: secrets
        env:
          APP_ID: ${{ secrets.CANARY_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.CANARY_DISPATCH_APP_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CANARY_DISPATCH_APP_ID / CANARY_DISPATCH_APP_KEY are not set; the bynk-lang canary was not told about $GITHUB_REF_NAME"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint canary-dispatch token
        if: steps.secrets.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CANARY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.CANARY_DISPATCH_APP_KEY }}
          owner: bynk-lang
          repositories: .github
          permission-contents: write
      - name: Send bynk-release
        if: steps.secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # The canary takes a bare version ("0.304.0"); it validates the format
        # and checks that the release exists before fanning out.
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq -cn --arg version "$version" \
            '{event_type: "bynk-release", client_payload: {version: $version}}' \
            | gh api -X POST repos/bynk-lang/.github/dispatches --input -
          echo "::notice::Sent bynk-release $version to bynk-lang/.github"

  # Publish the workspace crates in dependency order. Modern cargo waits for each
  # crate to appear in the index before returning, so the next publish resolves.
  # Runs automatically on a version-tag push (alongside the GitHub Release), and
  # on a manual dispatch with publish_crates checked (a re-run / override). The
  # per-crate "already on crates.io?" guard makes it re-run-safe and tolerant of
  # a tag that re-publishes unchanged crates (a partial publish can be retried).
  #
  # Auth — OIDC Trusted Publishing (no long-lived token). Requires a Trusted
  # Publisher (owner `bynk-lang`, repo `bynk`, workflow `release.yml`, no
  # environment) registered on EACH published crate at crates.io. Trusted
  # Publishing can only attach to a crate that already exists, so the FIRST
  # publish of a new/renamed name must be done with a token via the companion
  # `release-bootstrap.yml` workflow; configure the Trusted Publisher and switch
  # back here for every subsequent release.
  publish-crates:
    name: Publish to crates.io
    needs: [verify, test]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_crates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write # OIDC for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - name: cargo publish (bynk-grammar -> bynk-std -> bynk-syntax -> bynk-project -> bynk-registry-core -> bynk-ts -> bynk-render -> bynk-fmt -> bynk-check -> bynk-ir -> bynk-lower -> bynk-emit -> bynk-strip -> bynk-ide -> bynk-driver -> bynkc -> bynk -> bynk-lsp)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          for crate in bynk-grammar bynk-std bynk-syntax bynk-project bynk-registry-core bynk-ts bynk-render bynk-fmt bynk-check bynk-ir bynk-lower bynk-emit bynk-strip bynk-ide bynk-driver bynkc bynk bynk-lsp; do
            if curl -sfL -A "bynk-release (github actions; bynk-lang/bynk)" \
                 "https://crates.io/api/v1/crates/$crate/$ver" -o /dev/null; then
              echo "::notice::$crate@$ver already on crates.io — skipping"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  # Publish the tree-sitter grammar (node bindings + grammar source) to npm.
  # Runs automatically on a version-tag push, and on a manual dispatch with
  # publish_npm checked (re-run / override). The "already on npm?" guard makes
  # it re-run-safe.
  #
  # Auth — OIDC Trusted Publishing (no long-lived token). A Trusted Publisher
  # (this repo + this workflow) is configured for `tree-sitter-bynk` on
  # npmjs.com; with `id-token: write` and npm >= 11.5.1 (both wired below) the
  # CLI authenticates via OIDC and records provenance automatically — no
  # NODE_AUTH_TOKEN. As with the crates, the FIRST publish of a new/renamed
  # package must be done with a token via `release-bootstrap.yml`, since the
  # Trusted Publisher can only be configured on an existing package.
  publish-npm:
    name: Publish to npm
    needs: [verify, test]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    defaults:
      run:
        working-directory: tree-sitter-bynk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # npm@latest (>=12) requires Node >=22.22.2; Node 20 is too old for it.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing + provenance need npm >= 11.5.1 (newer than Node 22's
      # bundled 10.x), so pull a newer CLI on top of the Node runtime. Pinned to
      # an exact 11.x patch, NOT @latest: npm 12 blocks dependency install scripts by
      # default (`allowScripts`), which stops tree-sitter-cli's install.js from
      # fetching the `tree-sitter` binary — the `tree-sitter generate` step below
      # then fails ENOENT. npm 11 still runs those scripts and satisfies the
      # provenance floor. Exactly version-pinned; a global CLI install has no
      # lockfile/commit-hash to pin against, so this is the pinned form Scorecard
      # Pinned-Dependencies can get here. Accepted, #828.
      - name: Update npm
        run: npm install -g npm@11.18.0
      - name: Install deps
        run: npm ci
      - name: Regenerate parser from grammar.js
        run: npx tree-sitter generate
      - name: Publish (OIDC; skip if already published)
        # No NODE_AUTH_TOKEN — npm authenticates via the OIDC id-token under
        # Trusted Publishing and records a signed provenance attestation.
        run: |
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "::notice::$name@$ver already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
