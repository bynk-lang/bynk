name: Deploy the playground (Cloudflare Pages)

# Slice 0 of the documentation track. The playground (in-browser REPL) shipped in
# `playground/` but is reachable by no one until its two origins are deployed. The
# build runs *here* — where the Rust/wasm toolchain already lives — and uploads the
# prebuilt `dist/` to Cloudflare Pages; we never ask Cloudflare to compile the
# compiler. The deep-link/sandbox decisions this realises are ADR 0140.
#
# Gated on a GREEN CI run, not on the push itself.
#
# This used to trigger straight off `push: branches: [main]`, wholly independent
# of ci.yml — so the playground published from `main` whether or not its suite
# passed. That is not hypothetical: `main` failed CI in ~17% of recent runs, and
# the deploy would ship a compiler build to the public REPL from a tree with a
# known-red suite. The deploy re-builds, so a commit that does not COMPILE can't
# ship; what leaked through was the failure mode `main` actually has — it builds
# and its tests fail.
#
# `workflow_run` replaces the path filters (it accepts none), so the "did
# anything I care about change?" decision moved into the job below, where it is
# now stated ONCE rather than duplicated between trigger and job.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual run — the first deploy (after the Pages projects + secrets exist) and
  # any redeploy without a code change.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: deploy-playground
  cancel-in-progress: false

jobs:
  # Decide whether this commit is worth a redeploy, and expose the exact SHA the
  # build must use. Kept as its own tiny job so the whole expensive build below
  # is gated ONCE by `needs`/`if`, rather than every step carrying its own `if:`
  # (which is where a step gets forgotten and runs against the wrong tree).
  decide:
    name: Should we deploy?
    # Only a *successful* CI run may deploy, and only one whose commit is already
    # ON this repository's `main`. A manual dispatch is the maintainer explicitly
    # overriding the first of those, so it is allowed through.
    #
    # The second and third conditions are what make the checkout below safe, and
    # they are not optional. `workflow_run` runs the DEFAULT BRANCH's copy of this
    # file with full access to the repo's secrets, and then checks out a SHA named
    # by the triggering run. CI fires on `pull_request`, which includes pull
    # requests from forks, and `branches: [main]` filters on the triggering run's
    # HEAD branch — which for a fork PR is the branch name in the fork, and a
    # fork's default branch is `main`. So a pull request opened from any fork's
    # `main` matched this trigger, and its head SHA — arbitrary attacker-authored
    # code — was checked out and built by the `deploy` job, which runs `npm ci`
    # (install scripts), a wasm build (build scripts) and `npm run build`, in a job
    # holding the Cloudflare deploy token. That is the "pwn request" pattern:
    #   https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    # OpenSSF Scorecard flagged it as a critical Dangerous-Workflow finding.
    #
    # `event == 'push'` is the load-bearing guard: a push to this repository's
    # `main` requires write access, whereas anyone can open a pull request. It also
    # correctly excludes the weekly `schedule` run and `merge_group`, neither of
    # which is a new commit on `main` worth redeploying. The `head_repository`
    # check closes the same door from the other side and keeps the guarantee
    # legible without reasoning about branch-name collisions.
    #
    # Note that `deploy-site.yml` carries the same guard for the same reason —
    # they are separate workflows with one shared hazard, so the two must move
    # together.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changed.outputs.value }}
      sha: ${{ steps.changed.outputs.sha }}
    steps:
      # This job deliberately holds NO WORKING TREE. It used to check the commit
      # out and run `git diff HEAD^ HEAD`, which meant `ref:` naming the triggering
      # run's head SHA — the literal form OpenSSF Scorecard reports as an untrusted
      # code checkout. The `if:` guard above is what actually closes that hole, but
      # a job that only needs a LIST OF FILENAMES has no business materialising the
      # commit at all, so the list now comes from the commits API and the checkout
      # is gone. The one checkout that remains is in `deploy`, which genuinely
      # needs the tree, and which reaches the SHA through this job's output.
      #
      # The SHA still has to be the one CI ACTUALLY VALIDATED, not `github.sha`.
      # On a `workflow_run` event `github.sha` is the default-branch tip at fire
      # time, NOT the commit the triggering run tested. With the stamp pushing
      # ~60s after every merge those are routinely different commits, so using
      # `github.sha` would pair a green-CI signal with an unvalidated tree — the
      # gate would look like it worked while deploying something else entirely.
      # On workflow_dispatch there is no triggering run, so `github.sha` (the tip
      # of the dispatched ref) is the right answer — that is what a manual
      # redeploy means.
      #
      # The paths that make a redeploy worth doing live in the grep below. That
      # list replaces the `on.push.paths` filter that `workflow_run` cannot
      # express; it lives here ONLY, so there is no second copy to drift out of
      # step with the trigger. A manual dispatch skips the check and always
      # deploys.
      - name: Does this commit affect the playground?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `set -e` (so a failed `gh api` fails the job) but deliberately NOT
          # `pipefail`. `grep -q` exits on its first match; if the producer still
          # has output buffered at that point it takes SIGPIPE, and under
          # `pipefail` that non-zero status becomes the pipeline's — inverting the
          # test, so a commit that SHOULD deploy is read as "no match" and skipped.
          # It needs the file list to exceed the ~64KB pipe buffer, so the 300-entry
          # cap makes it unlikely rather than impossible: reproduced at 299 files
          # with long paths (180KB), where the pipefail form returned false on a
          # list whose FIRST entry matched.
          set -eu
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::notice::manual dispatch — deploying regardless of changed paths"
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `.files` is the commit's diff against its first parent — the same
          # comparison `git diff HEAD^ HEAD` makes. It is capped at 300 entries,
          # and the API omits the key entirely on some very large commits. Both
          # cases mean "the list is not trustworthy", so both deploy rather than
          # silently lose the entry that would have triggered it. `jq length` of a
          # missing key is 0, so the two collapse into one test — and 0 must not
          # fall through: iterating a null `.files` fails, and without `pipefail`
          # that reads as "no match" and skips the deploy.
          resp=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}")
          count=$(printf '%s' "$resp" | jq '.files | length')
          if [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "::notice::commit reports $count changed files — the API list is absent or truncated, so deploying rather than risk a false skip"
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$resp" | jq -r '.files[].filename' \
             | grep -qE '^(playground/|bynk-wasm/|tree-sitter-bynk/|\.github/workflows/deploy-playground\.yml$)'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing under playground/, bynk-wasm/ or tree-sitter-bynk/ changed — skipping the deploy"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build + deploy to Cloudflare Pages
    needs: decide
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Gate on the secrets' presence in one tiny step whose env holds the token,
      # exposing only a boolean output. The credentials themselves are attached
      # step-level to the two wrangler steps that need them (below) — never
      # job-level, so `npm ci` install scripts and the cargo/wasm build never see
      # the token. Before the maintainer adds the Cloudflare secrets, the build
      # still runs and the upload steps skip, so the workflow is green rather than
      # red on the first push.
      - name: Check for Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # The exact SHA `decide` resolved and validated — never `github.sha`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # wasm-bindgen-cli must be the same version as the wasm-bindgen crate in
      # Cargo.lock: the glue it generates is matched to the module the crate
      # compiled. Its own check compares only a schema version, so a mismatch can
      # still build. xtask/tests/wasm_bindgen_pin.rs fails when the two differ.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      # wasm-opt (binaryen) shrinks the release artefact (-Oz, the size budget).
      # build-wasm.sh applies it only when present, so this is an optimisation.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # wrangler@4.112.0 (the deploy steps below) requires Node >=22; the
          # build steps run fine on it too. Keep in step with deploy-site.yml.
          node-version: "22"
      # The grammar wasm (web-tree-sitter highlighting) is built by
      # `tree-sitter build --wasm`; the modern CLI downloads its own wasi-sdk
      # toolchain, so no emscripten/Docker setup is needed here. It is required for
      # the bundle: `src/vendor/highlights.scm` is a build-time import of
      # `npm run build`, staged by this step.
      - name: Install tree-sitter deps + generate parser
        working-directory: tree-sitter-bynk
        run: |
          npm ci
          npx tree-sitter generate
      - name: Install playground deps
        working-directory: playground
        run: npm ci
      - name: Build the wasm compiler (release + wasm-opt)
        working-directory: playground
        run: npm run build:wasm -- --release
      - name: Build the grammar wasm (web-tree-sitter highlighting)
        working-directory: playground
        run: npm run build:grammar
      - name: Bundle the app (production origins)
        working-directory: playground
        run: npm run build
      # Deploy the SAME dist/ to two Pages projects. The app origin serves
      # index.html + app.js + the wasm compiler; the sandbox origin serves
      # sandbox.html + sandbox.js. The two MUST be different origins — that
      # separation IS the safety boundary (ADR 0140): untrusted snippet code runs
      # only on the opaque sandbox origin and can never reach the app origin's
      # storage. `--branch=main` publishes to the project's production deployment.
      - name: Deploy the app origin (playground.bynk-lang.org)
        if: steps.gate.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 pages deploy playground/dist --project-name=bynk-playground --branch=main
      - name: Deploy the sandbox origin (sandbox.bynk-lang.org)
        if: steps.gate.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 pages deploy playground/dist --project-name=bynk-playground-sandbox --branch=main
      - name: Note when deploy was skipped
        if: steps.gate.outputs.present == 'false'
        run: echo "::notice::Cloudflare secrets not set — built dist/ but skipped the upload. See playground/README.md §Deploy."
