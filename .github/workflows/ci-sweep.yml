name: CI sweep

# GitHub sometimes drops the event that would start CI (#3119: an incident left
# PRs and merge-queue groups with no `ci.yml` run at all). A PR with no run
# never gets `CI green`, so it fails safe but sits unnoticed; a queue group with
# no run blocks every entry behind it. This job only REPORTS such cases, on one
# tracking issue. It never re-runs, pushes or dequeues anything: that is a
# person's call (push or toggle draft/ready; for a queue group, take the PR out
# of the queue and add it back).
#
# The reporting half is scripts/ci/ci-sweep-report.sh, tested in xtask against a
# stub `gh`. Scheduled workflows run only from the default branch, so the whole job cannot be
# exercised before it merges; once on `main`, run it by hand with
# `gh workflow run ci-sweep.yml`.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Find PRs and queue groups with no CI run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Longer than the delivery lag seen in #3119 (a run created ~20 min late),
      # so a late event is not reported. A queue group is created by GitHub at
      # enqueue time and never lags, so its grace is shorter.
      PR_GRACE_MIN: "45"
      GROUP_GRACE_MIN: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Look for heads with no ci.yml run
        run: |
          set -euo pipefail
          now=$(date +%s)
          findings=""

          # Count of ci.yml runs on a SHA, any event and any status.
          runs_on() {
            gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$1&per_page=1" --jq .total_count
          }

          # 1. Open PRs. Fork PRs are skipped: their runs wait for approval
          # and also show no run, which is not a lost event.
          while IFS=$'\t' read -r number sha updated; do
            age=$(( (now - $(date -d "$updated" +%s)) / 60 ))
            [ "$age" -ge "$PR_GRACE_MIN" ] || continue
            [ "$(runs_on "$sha")" = "0" ] || continue
            findings="$findings- PR #$number: head \`$sha\` has no \`ci.yml\` run (idle ${age} min). Push a commit, or toggle draft/ready, to start one. <!-- ci-sweep:$sha -->"$'\n'
          done < <(gh pr list --state open --limit 200 \
            --json number,headRefOid,updatedAt,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | [.number, .headRefOid, .updatedAt] | @tsv')

          # 2. Merge-queue groups. Only a group that is its PR's CURRENT queue
          # entry counts; leftover branches from merged or re-queued entries
          # are skipped.
          owner=${GH_REPO%/*}; repo=${GH_REPO#*/}
          while IFS=$'\t' read -r ref sha; do
            name=${ref#refs/heads/gh-readonly-queue/main/}
            number=${name#pr-}; number=${number%%-*}
            case "$number" in ''|*[!0-9]*) continue ;; esac
            created=$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date)
            age=$(( (now - $(date -d "$created" +%s)) / 60 ))
            [ "$age" -ge "$GROUP_GRACE_MIN" ] || continue
            current=$(gh api graphql -F owner="$owner" -F repo="$repo" -F number="$number" -f query='
              query($owner:String!,$repo:String!,$number:Int!){
                repository(owner:$owner,name:$repo){
                  pullRequest(number:$number){ state mergeQueueEntry{ headCommit{ oid } } }
                }
              }' --jq '.data.repository.pullRequest | select(.state == "OPEN") | .mergeQueueEntry.headCommit.oid // empty')
            [ "$current" = "$sha" ] || continue
            [ "$(runs_on "$sha")" = "0" ] || continue
            findings="$findings- Merge queue: PR #$number's group \`$sha\` has no \`ci.yml\` run (queued ${age} min) and blocks every entry behind it. Take #$number out of the queue and add it back to rebuild the groups. <!-- ci-sweep:$sha -->"$'\n'
          done < <(gh api "repos/$GH_REPO/git/matching-refs/heads/gh-readonly-queue/main/" \
            --jq '.[] | [.ref, .object.sha] | @tsv')

          # Report once per SHA on a single tracking issue. The logic lives in
          # a script so xtask tests can run it against a stub `gh` (#3143).
          printf '%s' "$findings" | bash scripts/ci/ci-sweep-report.sh
