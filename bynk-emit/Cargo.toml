[package]
name = "bynk-emit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build orchestration and TypeScript emission for the Bynk compiler."
keywords = ["compiler", "dsl", "typescript", "codegen", "language"]
categories = ["compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
# #521: bynk.toml parsing (read_project_paths). #980: also the schema
# registry (`bynk.schema.lock`), same format.
toml.workspace = true
toml_edit.workspace = true
# The layers this orchestrates: syntax (AST/spans) and the checked program.
bynk-syntax.workspace = true
bynk-ts.workspace = true
bynk-check.workspace = true
# The system model (crate-hygiene B1, #2939): the declaration-level vocabulary
# and its builder. They were carved out of this crate at P7.d1 as `bynk-ir` and
# `bynk-lower` (ADR 0332's deferred split, ADR 0385), and merged as `bynk-model`.
bynk-model.workspace = true
# P4.0 (#1113): the project model (discovery, graph, paths, consistency,
# schema-registry read/write) — this crate now depends on it rather than
# owning it directly.
bynk-project.workspace = true

[dev-dependencies]
# D1 (#2982): the emitter's in-crate tests drive the whole pipeline (`testkit`), and the
# pipeline lives in the driver now. A path-only dev-dependency is stripped on publish and
# the cycle is a dev-dependency cycle only, so the normal build graph is unchanged. The
# tests see the driver's own copy of this crate, so `testkit` hands back only strings and
# the driver's output types, never this crate's.
bynk-driver = { path = "../bynk-driver" }
