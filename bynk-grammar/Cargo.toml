[package]
name = "bynk-grammar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Renders the Bynk tree-sitter grammar to EBNF for the language reference."
publish = false
keywords = ["compiler", "dsl", "grammar", "ebnf", "language"]
categories = ["compilers", "parser-implementations"]

[lib]
path = "src/lib.rs"

[dependencies]
# `preserve_order` keeps the grammar rules in source order so the rendered
# appendix matches the committed Book `reference/grammar.md` byte for byte.
serde_json = { workspace = true, features = ["preserve_order"] }
