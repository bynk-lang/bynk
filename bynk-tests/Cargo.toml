[package]
name = "bynk-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Bynk integration-test corpus (fixtures, goldens and behaviour suites). Not a product crate: unpublished, kept off the release workflows' crate list."
# One integration-test binary, not one per file: see tests/it.rs. Linking ~130
# test binaries, each the whole compiler, dominated the Windows CI build.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

# `CARGO_BIN_EXE_<name>` is set only for the package's own binaries, so the
# corpus can't see `bynk`'s. This forwards to `bynk`'s own `main.rs` (an
# `include!`, so it cannot drift) under a name that doesn't collide with
# `target/<profile>/bynk`. The corpus drives `bynk test`/`check`/`compile`/`fmt`
# (E3 retired the separate `bynkc` binary it used to drive).
[[bin]]
name = "bynk-under-test"
path = "src/bin/bynk-under-test.rs"

[dependencies]
# What the corpus drives, and what the `bynk-under-test` binary needs.
# Path-only: `bynk` is the last crate published and `bynk-tests` is not published.
bynk = { path = "../bynk" }
bynk-driver.workspace = true
bynk-emit.workspace = true
clap.workspace = true

[dev-dependencies]
serde_json.workspace = true
# `xtask::site_page` (the generated-page transform `wire_reference` uses).
xtask = { path = "../xtask" }
bynk-syntax.workspace = true
bynk-check.workspace = true
regex.workspace = true
bynk-fmt.workspace = true
which.workspace = true
bynk-ide.workspace = true
bynk-testkit.workspace = true
bynk-ts.workspace = true
bynk-project.workspace = true
