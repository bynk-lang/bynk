<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bynk">
  <title>Bynk</title>
  <!-- Three bento blocks: a wide amber block over a teal one and a dark, outlined one, the
       same mark as the playground's favicon and link-preview card. No background, so it sits
       on a light or a dark tab bar; the dark block's outline keeps it visible on a dark one;
       legible at 16px. -->
  <rect x="3" y="3" width="58" height="33" rx="7" fill="#f2b134" />
  <rect x="3" y="40" width="28" height="21" rx="6" fill="#3cc4a6" />
  <rect x="34" y="41" width="26" height="19" rx="5" fill="#1d2825" stroke="#5f7a70" stroke-width="2" />
</svg>
