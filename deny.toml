# cargo-deny policy. Complements `cargo audit` (RustSec advisories) with
# licence-policy enforcement, duplicate/wildcard detection, and source
# allowlisting. Run by the `deny` CI job (EmbarkStudios/cargo-deny-action).
#
# NOTE: the `licenses.allow` list below is a broad permissive set covering the
# common Rust ecosystem. The first CI run may surface a transitive crate whose
# licence is not yet listed — add it (or an `exceptions` entry) rather than
# widening the policy blindly.

[advisories]
version = 2
# Fail on any crate pulled from a source with a known advisory. (Overlaps the
# standalone `cargo audit` job by design — defence in depth.)
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]

[bans]
# Duplicate versions stay a warning: the workspace deliberately pins some deps
# and Dependabot grooms duplicates. Wildcard requirements are denied — the
# ratchet against unpinned `*` deps on crates.io stays live; the one
# deliberate exception is bynk-testkit's own path-only dev-dependency (#1560:
# a version there would break `cargo publish` for bynk/bynk-lsp
# unconditionally, since bynk-testkit is `publish = false` and can never
# resolve against the registry). allow-wildcard-paths scopes that exception
# to path dependencies specifically — every workspace.dependencies entry
# without one still carries a version, so nothing else is exempted.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io (and explicitly-allowed git sources) may be pulled.
unknown-registry = "deny"
unknown-git = "deny"
