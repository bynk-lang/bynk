[package]
name = "bynk-project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The project model of the Bynk compiler: discovery, the unit dependency graph, path resolution, cross-unit consistency checks, and the schema-registry document."
keywords = ["compiler", "dsl", "language"]
categories = ["compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
# #521/#980: `bynk.toml` and `bynk.schema.lock` are both TOML; (de)serialising
# the schema registry document.
toml.workspace = true
serde.workspace = true
# The lowest leaf this sits on: AST/spans/CompileError, and the diagnostic
# severity classification `AttributedError`'s sink needs.
bynk-syntax.workspace = true
# #2096: `schema` derives the `bynk.toml` JSON Schema's table types
# (`manifest_schema`). Off by default: only `xtask` (which generates the
# schema) and `bynk-lsp`'s tests turn it on; no shipped binary needs it.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]
