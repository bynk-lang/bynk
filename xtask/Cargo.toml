[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Repo automation for Bynk — the increment-allocation tooling. Slice 0 validates the pending-increment files under design/pending/; the merge-time stamp (version + ADR-number assignment) lands in later slices. Not a product crate: unpublished, kept off the release workflows' crate list."

[dependencies]
bynk-syntax.workspace = true
serde_json.workspace = true
# #2096: `manifest-schema` generates `bynk.toml`'s JSON Schema from the tables'
# own types, which these two crates expose behind their `schema` features.
bynk-project = { workspace = true, features = ["schema"] }
bynk-fmt = { workspace = true, features = ["schema"] }
schemars.workspace = true
# #2096: `tests/manifest_schema.rs` parses the reference page's example manifest; A4
# (#2976): the `unused_deps` probe parses the workspace's `Cargo.toml` files.
toml.workspace = true
# C4b (#2940): the docs-consistency checks (`tests/docs_consistency`) and the grammar
# renderer they share (`grammar`).
serde.workspace = true
regex.workspace = true

[dev-dependencies]
# `cli_reference` renders the CLI page from `bynk`'s `bynkc` compatibility `clap` command.
# Path-only: `bynk` is published last and `xtask` is not published.
bynk = { path = "../bynk" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
