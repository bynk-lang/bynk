[package]
name = "bynk-driver"
description = "The command bodies shared by the Bynk CLIs (bynkc and bynk): project rooting, check, fmt, test, and output writing."
keywords = ["compiler", "dsl", "cli", "language"]
categories = ["compilers", "command-line-interface"]
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Declared via `.workspace = true` so the published crate carries a crates.io
# version requirement (from [workspace.dependencies]); a bare `{ path = ... }`
# builds locally but has no version and fails `cargo publish`.
bynk-emit.workspace = true
bynk-fmt.workspace = true
bynk-render.workspace = true
# `doc_examples` lexes and parses a unit to find its doc comments (#2461).
bynk-syntax.workspace = true
# P7.6 (#1309): `write_output`'s real write boundary prints `Document::Ts`
# artefacts through the one printer that owns a character (R7.3).
bynk-ts.workspace = true
# `test_json`'s `TestRun` document + `coverage`'s V8-coverage JSON parsing
# (moved down from `bynkc`, Wave 5 §5.4 — both `bynkc` and `bynk` need them).
serde.workspace = true
serde_json.workspace = true
# `probe`'s tool detection (moved down from `bynk`, Wave 5 §5.4 — `bynkc`
# needs it too, replacing its old PATH-only `tool_exists`).
which.workspace = true
# The shared `test` subcommand contract (Wave 5 §5.4, findings #40/#72): one
# `#[derive(Args)]` struct both `bynkc::cli` and `bynk::cli` flatten instead
# of hand-spelling the same 8 flags twice.
clap.workspace = true
