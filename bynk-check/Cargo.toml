[package]
name = "bynk-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The semantic-analysis layer of the Bynk compiler: name resolution, type checking, the kernel and builtin registries, first-party sources, and the analysis tables the IDE queries."
keywords = ["compiler", "dsl", "type-checker", "language"]
categories = ["compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
# The syntax foundation this layer analyses.
# #2220: the agent state model (`agent_state`) labels its guards with the expression
# printer (`bynk_syntax::print`); guards are merged by that text.
bynk-syntax.workspace = true
# The first-party sources, bindings and metadata, as data (standard-library
# track, #1940): re-exported unchanged as `firstparty`.
bynk-std.workspace = true
# Discovery, the unit graph, and manifest/schema-registry document shapes —
# P4.1 (#1115): the new project-level analysis entry point discovers via this
# crate and resolves/checks via this crate's own already-local modules.
bynk-project.workspace = true
bynk-ts.workspace = true
# Refinement-predicate validation in the checker.
regress.workspace = true

# #3070: not on wasm32 (the playground has no migrations folder, and the C
# amalgamation does not build for wasm32-unknown-unknown).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
# Hyperdrive H4 (#3321): libpg_query is C, and has no wasm32-unknown-unknown build.
pg_query.workspace = true
