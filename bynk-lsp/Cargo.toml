[package]
name = "bynk-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "bynkc-lsp, the Language Server for the Bynk language."
keywords = ["compiler", "dsl", "lsp", "language-server", "language"]
categories = ["development-tools", "compilers"]
# These guards read a sibling directory — ../vscode-bynk, ../examples,
# ../bynkc — which is not part of this crate's package. Keep them out of the
# published tarball so a standalone `cargo test` on the crates.io release can't
# fail on the missing sibling. They still run in-repo via `cargo test
# --workspace`, the only place their inputs exist, so excluding them costs no
# coverage. Reading a real project on disk is deliberate, not incidental: ADR
# 0190 D6 requires these fixtures to measure real `diagnose_project` output, so
# the alternative — skipping when the root is absent — would let them pass
# vacuously, which is the failure mode ADR 0191's coverage sweep exists to
# catch. Every entry below is a test that reads outside this directory; add the
# next one here.
#   v0.29  (ADR 0058): legend_drift      → ../vscode-bynk/package.json
#   v0.121 (ADR 0157): scaffolds_compile → ../vscode-bynk/snippets/bynk.json
#   v0.166 (#616):     hover_references     → ../examples/todo, ../bynkc fixtures
#   v0.168 (#619):     declaration_spans    → ../examples/todo, ../bynkc fixtures
#   v0.178 (#647):     project_model        → ../examples/todo, ../bynkc fixtures
#   #848:              document_link_fixture → ../examples/rate-limiter
#   #851:              architecture_request  → ../examples/rate-limiter
exclude = [
    "tests/legend_drift.rs",
    "tests/scaffolds_compile.rs",
    "tests/hover_references.rs",
    "tests/declaration_spans.rs",
    "tests/project_model.rs",
    "tests/document_link_fixture.rs",
    "tests/architecture_request.rs",
    "tests/wire_contract_request.rs",
]

[lib]
name = "bynk_lsp"
path = "src/lib.rs"

[[bin]]
name = "bynkc-lsp"
path = "src/main.rs"

[dependencies]
# Slice 5: the language server links the analysis libraries directly, not the
# whole `bynkc` compiler crate. `bynk-ide` is the diagnose/project-analysis
# surface; `bynk-check` the captured tables + checker types; `bynk-syntax` the
# spans/AST/lexer/parser; `bynk-fmt` formatting.
#
# content-ownership track (#1086), slice 0: deliberately no `bynk-emit`
# dependency here. `bynk-ide` already re-shapes everything this crate needs
# (`AnalysisRoots`, `discover_files`, `diagnose_project_with`) from
# `bynk-check`/`bynk-project` (P4.2, #1122 — no longer from `bynk-emit` at
# all) into its own IDE-facing surface with no `bynk-emit` type crossing into
# `bynk-lsp` — see `bynk-ide/src/lib.rs`'s `AnalysisRoots` doc comment. Adding
# `bynk-emit` here would give this crate a second, parallel way to reach the
# same project model `bynk-ide` already owns for it.
bynk-ide.workspace = true
bynk-check.workspace = true
bynk-syntax.workspace = true
bynk-fmt.workspace = true
bynk-emit.workspace = true
bynk-ts.workspace = true
regress.workspace = true
tower-lsp.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
# #1667: initialise an `LspService` and read the notifications on its
# `ClientSocket` (a panicked analysis round must reach the client).
tower.workspace = true
futures.workspace = true
# Content-ownership track (#1086) slice 3: the diagnose_project(&root,
# &HashMap::new()) replacement for tests/*.rs's fixtures. Dev-only — this
# crate's own production-code dependency-exclusion comment above is
# unaffected.
bynk-testkit.workspace = true
# #2096: `project.rs`'s test holds the `[lsp]` reader to the `bynk.toml`
# JSON Schema's description of it, which `bynk-project` holds.
schemars.workspace = true
bynk-project = { workspace = true, features = ["schema"] }
