name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, contract check, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24" # @vscode/vsce 4 requires Node >= 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:contract
      # The pinned release's contract + bynkc, kept per pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .contract-cache
          key: contract-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Check against the editor contract
        run: npm run check:contract
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - name: Stage the pinned bynk-wasm module
        run: npm run fetch:wasm
      - run: npm run build:web
      - run: node scripts/check-bundle.mjs --web
      # Not verified in the old repo's composite action form: this installs
      # Chromium directly.
      - run: npx playwright install --with-deps chromium
      - name: Web extension smoke tests (@vscode/test-web, headless)
        run: npm run test:web
      - run: npx --no vsce package --no-dependencies --skip-license

  integration:
    name: Integration tests (pinned release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The VS Code build the suite runs against; the cache keys on it.
      VSCODE_TEST_VERSION: "1.140.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # >= 22.6 for the debug paths: emitted `.ts` runs under Node's type stripping.
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .contract-cache
          key: contract-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Stage the pinned release's server and toolchain
        run: npm run fetch:toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}
      - name: Integration tests (xvfb)
        env:
          BYNK_TEST_BIN_DIR: .bynk-test-bin
        run: xvfb-run -a npm test

  server-pin:
    name: Server pin names a usable release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-server-pin.sh

  # The single required status check, so a skipped or renamed job can't wedge
  # the queue waiting for a check that never reports.
  ci-green:
    name: CI green
    if: always()
    needs: [build, integration, server-pin]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
