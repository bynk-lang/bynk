name: Release

# Tagging vX.Y.Z (the extension's own version line, not the compiler's) builds
# the VSIX with the pin as committed and publishes it to the Marketplace.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  vsix:
    name: Package the extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
      - name: The tag is the extension's version
        run: |
          ver="$(node -p "require('./package.json').version")"
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "::error::package.json is $ver but the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: The pin names a usable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-server-pin.sh --strict
      - run: npm ci
      - run: npm run check
      - run: npm run test:contract
      - run: npm run check:contract
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npm run fetch:wasm
      - run: npm run build:web
      - run: node scripts/check-bundle.mjs --web
      - run: npx --no vsce package --no-dependencies --skip-license --out bynk.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: bynk.vsix

  publish:
    name: Publish to the VS Code Marketplace
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write # OIDC for the Entra federated credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Publish (Entra ID; skip if already published)
        run: npx --yes @vscode/vsce@4.0.0 publish --azure-credential --skip-duplicate --packagePath bynk.vsix
