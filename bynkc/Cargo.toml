[package]
name = "bynkc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Final release: bynkc is now bynk. Install the bynk crate instead (cargo install bynk); this crate only forwards to it."
keywords = ["compiler", "dsl", "typescript", "language"]
categories = ["compilers"]
# `cargo binstall` fetches the release archive instead of compiling; the layout
# is the one release.yml's `binaries` job packages.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/bynk-v{ version }-{ target }{ archive-suffix }"
bin-dir = "bynk-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "bynkc"
path = "src/main.rs"

[dependencies]
# `bynkc` is `bynk` under another name (#3013, E3): this crate's only content is
# the shim that calls into it, so `cargo install bynkc` still works for one
# release. Published after `bynk` (release.yml's crate list).
bynk.workspace = true
