[package]
name = "bynk-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The formatter for the Bynk language."
keywords = ["compiler", "dsl", "formatter", "language"]
categories = ["development-tools", "compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
# The formatter is an AST-walk over the syntax foundation — it links the
# `bynk-syntax` leaf only, never the compiler (slice 2 of crate-decomposition).
bynk-syntax.workspace = true
# #972: the `[fmt]` section of `bynk.toml` is parsed here, beside the
# `FormatOptions` it produces, so the CLI and the language server share one
# reader rather than a copy each. Two small crates — the "stays off the
# compiler" property this crate is built around is untouched.
serde.workspace = true
toml.workspace = true
# #2096: `schema` derives the `[fmt]` table's JSON Schema from `RawFmt`, the
# struct that reads it. Off by default, like `bynk-project`'s.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
proptest.workspace = true
# Used only to prove the round-trip guard's diagnostic renders without panicking
# (#735) — the presentation layer is not a runtime dependency of the formatter.
bynk-render.workspace = true
