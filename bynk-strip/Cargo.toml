[package]
name = "bynk-strip"
description = "Strip-only TypeScript-to-JavaScript for the Bynk compiler: erases type syntax with oxc, preserving runtime semantics and value imports."
keywords = ["compiler", "dsl", "typescript", "javascript", "language"]
categories = ["compilers", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# A pure-Rust TS parser + type-erasing transform + codegen — no Node/tsc in the
# loop and wasm-safe (the wasm toolchain slice compiles this path to wasm32).
oxc = { version = "0.146", features = ["semantic", "transformer", "codegen"] }
# #2705: composes the emitter's Bynk-to-TS source map with the strip codegen's
# TS-to-JS map. Already in the tree (oxc_codegen's `sourcemap`); wasm-safe.
oxc_sourcemap = "9"

