[package]
name = "bynk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Bynk developer driver: links the compiler in-process and orchestrates the Node toolchain (doctor, new, dev, deploy, check, fmt, test, explain)."
keywords = ["bynk", "cli", "toolchain", "driver"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bynk"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Slice 7: the driver links the pipeline in-process instead of shelling `bynkc`.
# `bynk-emit` gives it `compile_project` + `compile_with_warnings` + `write_output`
# + the Node floor; `bynk-syntax` the lexer (name validation) + `CompileError`;
# `bynk-render` the diagnostic rendering; `bynk-fmt` the formatter behind `bynk
# fmt` (v0.133). It no longer depends on the `bynkc` crate.
bynk-emit.workspace = true
# #521: the shared bynkc/bynk front-end (fmt/check bodies, flatteners, rooting).
bynk-driver.workspace = true
# #2240: `bynk.lock` and the store (packaging slice 2b).
bynk-project.workspace = true
bynk-syntax.workspace = true
bynk-render.workspace = true
bynk-fmt.workspace = true
clap.workspace = true
which.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# #2004: the deployment's call secret, minted by `bynk deploy`.
getrandom.workspace = true
# #2240: the canonical-tree checksum of a fetched git dependency.
sha2.workspace = true
# State-migrations S4 (#2259): `bynk migrate sweep`'s HTTPS client.
ureq.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true

# #1762: `bynk dev` puts each wrangler in a job object on Windows, so stopping it
# stops the whole `cmd.exe` → `npx` → wrangler → `workerd` tree. No new crate
# in the shipped binary: clap already builds `windows-sys` on Windows (through
# anstream), so this only turns on the job-object features.
# #1955: `bynk dev` records SIGINT/SIGTERM so it can stop its wranglers before
# exiting. No new crate in the shipped binary: `which` already builds `libc` on
# Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# (bynk-fmt is a normal dependency as of v0.133 — `bynk fmt` and the `new`
# starter-rot test both use it.)
# Content-ownership track (#1086) slice 4: the CompileOptions::single/::split
# bare-call replacement for this crate's own integration-test fixtures.
bynk-testkit.workspace = true
