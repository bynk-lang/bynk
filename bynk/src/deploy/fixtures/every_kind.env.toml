# == staging ==
# Generated by bynk — do not edit by hand.
name = "shop"
main = "index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = []

[[services]]
binding = "SVC"
service = "other"

[[kv_namespaces]]
binding = "KV"
id = "<KV_NAMESPACE_ID>" # set at deploy time

[[kv_namespaces]]
binding = "KV_X"
id = "<KV_X_ID>" # set at deploy time

[[services]]
binding = "FOREIGN"
service = "legacy"

[[r2_buckets]]
binding = "R2_X"
bucket_name = "shop-x"

[[ratelimits]]
name = "RL_X"
namespace_id = "<RL_X_NAMESPACE>" # set at deploy time
simple = { limit = 10, period = 60 }

[[queues.producers]]
binding = "Q_X"
queue = "jobs"

[[analytics_engine_datasets]]
binding = "AE_X"
dataset = "shop_ae_x"

[[d1_databases]]
binding = "D1_X"
database_name = "shop-x"
database_id = "<D1_X_ID>" # set at deploy time

[[secrets_store_secrets]]
binding = "SECRET_X"
store_id = "store" # the store's name; its id is set at deploy time
secret_name = "secret"

[[send_email]]
name = "EMAIL_X"

[[hyperdrive]]
binding = "PG_X"
id = "<PG_X_ID>" # set at deploy time

[[hyperdrive]]
binding = "MYSQL_X"
id = "<MYSQL_X_ID>" # set at deploy time

[[vectorize]]
binding = "VEC_X"
index_name = "shop-vec-x"

[[durable_objects.bindings]]
name = "CONTAINER_X"
class_name = "BoxClass"

[[ai_search]]
binding = "AI_SEARCH_X"
instance_name = "docs"

[[mtls_certificates]]
binding = "MTLS_X"
certificate_id = "acme-client" # the certificate's name; `bynk deploy` replaces it with the id it resolves

[[durable_objects.bindings]]
name = "AGENT"
class_name = "Counter"

[[durable_objects.bindings]]
name = "FANOUT"
class_name = "Fanout"

[version_metadata]
binding = "CF_VERSION_METADATA"

[ai]
binding = "AI"

[images]
binding = "IMAGES"

[analytics]
binding = "CF_ANALYTICS_SQL"

[exports.BoxClass]
type = "durable-object"
storage = "sqlite"

[exports.Counter]
type = "durable-object"
storage = "sqlite"

[exports.Fanout]
type = "durable-object"
storage = "sqlite"

[[containers]]
class_name = "BoxClass"
scheduling_policy = "durable_object"

[containers.images.Cap]
dockerfile = "../../../box/Dockerfile"
build_context = "../../../box"

[vars]
BYNK_DATASET_AE_X = "shop_ae_x"

[triggers]
crons = ["0 * * * *"]

[[queues.consumers]]
queue = "jobs"
max_batch_size = 10


[assets]
directory = "assets"

[cache]
enabled = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[env.staging]
name = "shop-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.ai_search]]
binding = "AI_SEARCH_X"
instance_name = "docs"

[env.staging.analytics]
binding = "CF_ANALYTICS_SQL"

[[env.staging.analytics_engine_datasets]]
binding = "AE_X"
dataset = "shop_ae_x_staging"

[[env.staging.containers]]
class_name = "BoxClass"
scheduling_policy = "durable_object"

[env.staging.containers.images.Cap]
build_context = "../../../box"
dockerfile = "../../../box/Dockerfile"

[[env.staging.d1_databases]]
binding = "D1_X"
database_id = "<D1_X_ID>"
database_name = "shop-x"

[[env.staging.durable_objects.bindings]]
class_name = "BoxClass"
name = "CONTAINER_X"

[[env.staging.durable_objects.bindings]]
class_name = "Counter"
name = "AGENT"

[[env.staging.durable_objects.bindings]]
class_name = "Fanout"
name = "FANOUT"

[env.staging.exports.BoxClass]
storage = "sqlite"
type = "durable-object"

[env.staging.exports.Counter]
storage = "sqlite"
type = "durable-object"

[env.staging.exports.Fanout]
storage = "sqlite"
type = "durable-object"

[[env.staging.hyperdrive]]
binding = "PG_X"
id = "<PG_X_ID>"

[[env.staging.hyperdrive]]
binding = "MYSQL_X"
id = "<MYSQL_X_ID>"

[env.staging.images]
binding = "IMAGES"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "kv-id"

[[env.staging.kv_namespaces]]
binding = "KV_X"
id = "kv-x-id"

[[env.staging.mtls_certificates]]
binding = "MTLS_X"
certificate_id = "acme-client"

[[env.staging.queues.consumers]]
max_batch_size = 10
queue = "jobs-staging"

[[env.staging.queues.producers]]
binding = "Q_X"
queue = "jobs-staging"

[[env.staging.r2_buckets]]
binding = "R2_X"
bucket_name = "shop-x-staging"

[[env.staging.ratelimits]]
name = "RL_X"
namespace_id = "<RL_X_NAMESPACE>"

[env.staging.ratelimits.simple]
limit = 10
period = 60

[[env.staging.secrets_store_secrets]]
binding = "SECRET_X"
secret_name = "secret"
store_id = "store"

[[env.staging.send_email]]
name = "EMAIL_X"

[[env.staging.services]]
binding = "SVC"
service = "other-staging"

[[env.staging.services]]
binding = "FOREIGN"
service = "legacy"

[env.staging.triggers]
crons = ["0 * * * *"]

[env.staging.vars]
BYNK_DATASET_AE_X = "shop_ae_x_staging"

[[env.staging.vectorize]]
binding = "VEC_X"
index_name = "shop-vec-x-staging"

[env.staging.version_metadata]
