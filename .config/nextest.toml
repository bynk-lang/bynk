# cargo-nextest configuration. Every gate that runs the workspace suite runs
# under the `ci` profile (`cargo nextest run --profile ci`; see the #1676 block
# below); local `cargo nextest run` uses `default`.
#
# Why nextest at all: the suite is ~700 tests spread across dozens of
# integration-test binaries (the bynkc/tests/fixtures/** corpus especially).
# `cargo test` runs those binaries sequentially; nextest runs one process pool
# across all of them, cutting the test leg's wall-clock. There are no rustdoc
# doctests in the tree (nextest cannot run those), so nothing is lost — the
# `doc_examples` gate is an ordinary `#[test]`, which nextest runs normally.

# #1676: the `ci` profile is THE suite policy for every gate that runs the
# workspace suite — ci.yml's Test suite legs (the PR gate), release.yml's test
# job (the release gate) and release-bootstrap.yml's verify job. All three run
# `cargo nextest run --workspace --locked --profile ci`, so the retry policy
# below is decided here, once, not by which command a workflow happens to use.
# They used to differ: the release ran `cargo test` (threads in a shared
# process, no retry), stricter about flakes and weaker about isolation than the
# PR gate it was meant to repeat.
#
# Decided: a FLAKY pass does not fail the release, as it does not fail a PR.
# It is still listed in the run summary. If the release ever needs to be
# zero-retry, add a named `[profile.release]` here and point release.yml at
# it, rather than switching that workflow back to a different command. Note:
# a nextest profile inherits from `[profile.default]`, not from `[profile.ci]`.
# So a `[profile.release]` must restate everything `ci` sets (`fail-fast`,
# `failure-output`, `status-level`, and whatever else is added below), or move
# those shared settings into `[profile.default]` first. Otherwise the release
# would stop at the first failure and report differently from the PR gate:
# the same divergence this block exists to remove.
#
# `xtask/tests/suite_harness.rs` pins that all three workflows run this exact
# command, so a fourth variant fails a test rather than drifting silently.
[profile.ci]
# Surface every failure in one run rather than stopping at the first, so a
# single red fixture doesn't mask the rest — mirrors the matrix's
# `fail-fast: false` intent at the individual-test level.
fail-fast = false

# One retry, applied suite-wide. The intent is to absorb the occasional
# cold-sandbox flake in the external shell-outs — the workerd boot and the
# `tsc` type-check — but that surface is deliberately NOT name-scoped: the
# tsc-verify path runs inside most `*_behaviour` binaries, whose test names
# don't contain "tsc", so a `filter = 'test(/tsc/)'` override would miss the
# bulk of it. A blanket retry is the honest expression of "any test may hit a
# cold-sandbox flake." It does not silently mask a genuinely intermittent
# product bug: nextest lists a retried-then-passed test as FLAKY in the final
# summary, so an emitter path or race that only sometimes fails still leaves a
# visible trace to chase.
retries = { backoff = "fixed", count = 1, delay = "1s" }

# CI output: compact while green, but print the full output of every failed
# try, so a red run, and a retried one, is diagnosable from the log.
#
# `immediate-final`, not `final`: under `final` only a test's last try is
# printed, so a test that failed and then passed on its retry (FLAKY) left
# nothing but its name and time. A Windows FLAKY in
# `bynk job::tests::a_killed_wrappers_orphans_are_stopped_with_the_job`, and
# the first tries of the workerd smokes that #2299 fixed the retries of, could
# not be diagnosed for that reason. `immediate` prints each failing try's
# output as it fails; `final` repeats a test that still failed in the summary.
# So a test that fails both tries prints three times (try 1, try 2, summary).
# That duplication is the price of seeing a FLAKY test's first try; don't
# drop back to `final` to remove it.
#
# `status-level` only chooses which test statuses are *listed* as they happen;
# it says nothing about output. What decides whether a passing test's output
# is ever seen is `success-output`, left at its `never` default — so a test
# that prints a "SKIPPED" banner and passes is invisible here (#1671). A gate
# must therefore fail, not skip, when CI requires it (`BYNK_REQUIRE_TSC` and
# friends), rather than rely on its banner being read.
#
# `slow`, not `fail` (#1929): it lists a retry as it happens, and names a test
# still running past each `slow-timeout` period (`SLOW [> 120.000s] …`). At
# `fail`, nothing named a running test, and a terminated attempt printed
# nothing until the final summary. A passing test is still not listed, so a
# green run stays compact: no test reaches the period in a healthy run.
failure-output = "immediate-final"
status-level = "slow"

# A hung test is named at 2 minutes and killed at 10, rather than holding the
# job until its `timeout-minutes` cancels it. At the old `status-level = "fail"`
# the v0.330.4 release's Windows leg sat on one hung test (2340 of 2341 passed)
# until the 40-minute job limit cancelled it. That skipped every publish job,
# and the log could not say which test it was. A test past `period ×
# terminate-after` is now a TIMEOUT failure: listed with its output, and
# retried once under `retries` above. A retry that passes is listed as FLAKY in
# the final summary.
#
# The limit is generous on purpose. The slowest tests (the workerd runtime
# legs, `tsc_verify`) take about a minute on a fast Linux machine, and the
# longest bounded wait in the suite is a workerd leg's 180s boot window. A
# Windows runner's whole test phase is about 6 minutes, so no single test there
# approaches 10. A hang and its one retry cost at most 20 minutes, and every
# job running this profile must leave room for that:
# `xtask/tests/suite_harness.rs` checks each job's `timeout-minutes` against
# these two settings.
#
# One cost on unix: terminating a workerd leg skips its `Drop`, and its
# `wrangler dev` chain runs in a process group of its own (#1686,
# `bynkc/tests/wrangler/mod.rs`), out of reach of nextest's signal. The chain is
# left running for the rest of the job. The retry still boots: it is a fresh
# process, so it gets a fresh port (`20000 + pid % 10000`). A leaked chain is
# the lesser cost; a hang that cancels the job leaves the whole run unnamed.
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.default]
# Local runs keep the default (0) retries so flakes surface immediately.
retries = 0

# Start the longest tests first. nextest otherwise starts tests in binary
# order, so a long test in a late binary set the end of the whole run: on a
# 4-core runner (Linux CI, run 39901627770) `tsc_verify`'s corpus type-check
# started about 6 minutes into an 8-minute test phase, then ran 2 more. Started
# first, the long tests overlap the thousands of short ones instead of
# trailing them. This is longest-first scheduling, and it is why these stay
# whole rather than split per fixture: each is batched on purpose (one `tsc`
# for the corpus, a worker pool for the behaviour fixtures), so splitting would
# add work, where ordering only moves it.
#
# The list is the tests that took 20 s or more in a local 4-core run of the
# suite, highest priority to the longest. A missing entry costs only ordering,
# never correctness: re-rank from `cargo nextest run --status-level all` when
# the suite's slowest tests change. Overrides set in `default` apply to every
# profile, `ci` included.
[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & test(=behaviour_fixtures::marked_positive_fixtures_behave_as_expected)'
priority = 100

[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & test(=tsc_verify::emitted_typescript_passes_tsc_strict)'
priority = 90

[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & test(=example_tests_behaviour::every_example_test_suite_passes)'
priority = 80

[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & test(=import_closure::every_emitted_module_binds_every_name_it_uses)'
priority = 70

[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & test(=tsc_verify::emitted_javascript_is_valid_under_node)'
priority = 60

[[profile.default.overrides]]
filter = 'binary_id(bynk-fmt::comment_slots) & test(=a_comment_at_every_slot_is_kept_or_refused)'
priority = 50

[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & (test(/^remote_target_behaviour::/) | test(/^binding_workerd::/))'
priority = 40

[[profile.default.overrides]]
filter = 'binary_id(bynkc::it) & test(=tsc_verify::js_artefact_strips_every_fixture_to_js_shape)'
priority = 40

# On Windows, the registry conformance faults test opened dozens of loopback
# connections that each waited out a refused `[::1]` (see the test's `proxy`),
# so it ran for minutes there. Fixed in the test; kept early in case Windows
# stays the slowest leg for it.
[[profile.default.overrides]]
filter = 'binary_id(bynk::registry_conformance)'
priority = 30
